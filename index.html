<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кошелёк</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FAFBF8; --surface-2:#E2E7DF; --ink:#16211C; --muted:#667068; --line:#D3DAD0;
  --accent:#0F6B5A; --accent-ink:#F4FAF7; --in:#23845A; --out:#B9473B; --warn:#B7791F;
  --shadow:0 1px 2px rgba(22,33,28,.06),0 8px 24px rgba(22,33,28,.06);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512; --surface:#171F1B; --surface-2:#212B26; --ink:#E3EAE5; --muted:#8E9A93; --line:#2A3530;
  --accent:#4DBE9F; --accent-ink:#0B1411; --in:#5CC98E; --out:#EE7F70; --warn:#E3AC4F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512; --surface:#171F1B; --surface-2:#212B26; --ink:#E3EAE5; --muted:#8E9A93; --line:#2A3530;
    --accent:#4DBE9F; --accent-ink:#0B1411; --in:#5CC98E; --out:#EE7F70; --warn:#E3AC4F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:12px 110px;font-variant-numeric:tabular-nums;touch-action:pan-y;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.brand{font-family:Unbounded,sans-serif;font-weight:700;font-size:17px}
.sync{font-size:12px;color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.total{display:flex;flex-direction:column;gap:2px}
.total .num{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(28px,8.5vw,38px);letter-spacing:-.02em;line-height:1.15}
.note{font-size:13px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.debt{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.debt.done{opacity:.6}
.debt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border:0;background:none;padding:0;text-align:left;width:100%}
.debt-top .n{font-weight:600}
.debt-top .b{font-size:13px;color:var(--muted)}
.debt-top .sum{font-family:Unbounded,sans-serif;font-size:19px;white-space:nowrap}
.debt-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.debt-bottom .when{color:var(--muted)}
.debt-bottom .when.late{color:var(--out);font-weight:600}
.pay{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.empty{background:var(--surface);border-radius:18px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;padding:14px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(15,107,90,.35)}

.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;overscroll-behavior:contain;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-family:Unbounded,sans-serif;font-weight:500;font-size:17px;margin:0}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.field.half{grid-column:auto}
.hint{font-size:12px;color:var(--muted)}
input.in{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.check{display:flex;gap:10px;align-items:center;font-size:15px;grid-column:1/-1}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:14px;border-radius:12px;font-size:16px;width:100%}
.danger{border:1px solid var(--line);background:none;color:var(--out);font-weight:600;padding:12px;border-radius:12px;width:100%}
.danger.armed{background:var(--out);color:#fff;border-color:var(--out)}
.err{color:var(--out);font-size:13px;min-height:1em}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="brand">Кошелёк</span><span class="sync" id="sync"></span></header>
  <section class="total"><span class="label">Всего долгов</span><span class="num" id="total">0 ₽</span><p class="note" id="count"></p></section>
  <div class="list" id="list"></div>
</div>
<button class="fab" id="add">+ Добавить долг</button>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
/* ---------- утилиты ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
const money=n=>fmt.format(Math.round((+n||0)*100)/100)+" ₽";
const r2=n=>Math.round(n*100)/100;
const parseNum=s=>parseFloat(String(s==null?"":s).replace(/\s/g,"").replace(",","."));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=iso(new Date());
const uid=()=>"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dLabel=s=>new Date(s+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
/* Та же дата в следующем месяце; 31-е переходит на последний день короткого месяца. */
function nextMonth(s){
  const [y,m,d]=s.split("-").map(Number);
  const ny=m===12?y+1:y, nm=m===12?1:m+1, last=new Date(ny,nm,0).getDate();
  return ny+"-"+pad(nm)+"-"+pad(Math.min(d,last));
}

/* ---------- данные ---------- */
let debts=[];
const LS="koshelek.simple.v1";

/* Облако Telegram хранит строки до 4096 символов, поэтому список режется на части.
   Ключи с префиксом s1_ — отдельно от прошлых версий приложения. */
const TG=window.Telegram&&window.Telegram.WebApp;
const CS=TG&&TG.initData&&TG.isVersionAtLeast&&TG.isVersionAtLeast("6.9")?TG.CloudStorage:null;
const cs=(fn,...a)=>new Promise((ok,bad)=>CS[fn](...a,(e,r)=>e?bad(e):ok(r)));
const CHUNK=3900;
let chunks=0,timer=null,saving=false,dirty=false;

function setSync(t){$("sync").textContent=t}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(debts));localStorage.setItem(LS+".pending",dirty?"1":"")}catch(e){}}
function save(){
  dirty=true;saveLocal();render();
  if(!CS){setSync("Только на этом устройстве");return}
  setSync("Сохраняю…");clearTimeout(timer);timer=setTimeout(flush,400);
}
async function flush(){
  if(saving){timer=setTimeout(flush,300);return}
  saving=true;dirty=false;
  try{
    const json=JSON.stringify(debts),n=Math.ceil(json.length/CHUNK);
    for(let i=0;i<n;i++)await cs("setItem","s1_"+i,json.slice(i*CHUNK,(i+1)*CHUNK));
    await cs("setItem","s1_n",String(n));
    if(chunks>n){const old=[];for(let i=n;i<chunks;i++)old.push("s1_"+i);await cs("removeItems",old)}
    chunks=n;saveLocal();setSync("Сохранено в Telegram");
  }catch(e){dirty=true;saveLocal();setSync("Не сохранилось, повторю");timer=setTimeout(flush,5000)}
  saving=false;
}
async function load(){
  try{debts=JSON.parse(localStorage.getItem(LS))||[]}catch(e){debts=[]}
  render();
  if(!CS){setSync(TG&&TG.initData?"Обновите Telegram, чтобы данные сохранялись в облаке":"Только на этом устройстве");return}
  setSync("Загружаю…");
  try{
    const n=+(await cs("getItem","s1_n"))||0;chunks=n;
    let pending=false;try{pending=localStorage.getItem(LS+".pending")==="1"}catch(e){}
    if(pending&&debts.length){flush();return}
    if(n){
      const keys=[];for(let i=0;i<n;i++)keys.push("s1_"+i);
      const items=await cs("getItems",keys);
      debts=JSON.parse(keys.map(k=>items[k]||"").join(""))||[];
      saveLocal();render();
    }else if(debts.length){flush();return}
    setSync("Сохранено в Telegram");
  }catch(e){setSync("Нет связи с Telegram, данные пока в телефоне")}
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&dirty&&CS&&!saving){clearTimeout(timer);flush()}});

/* ---------- экран ---------- */
function render(){
  const open=debts.filter(d=>d.balance>0.005);
  $("total").textContent=money(open.reduce((s,d)=>s+d.balance,0));
  $("count").textContent=open.length?open.length+" "+plural(open.length,"долг","долга","долгов"):"";
  const sorted=debts.slice().sort((a,b)=>(a.balance<=0.005)-(b.balance<=0.005)||(a.nextDate||"9").localeCompare(b.nextDate||"9"));
  $("list").innerHTML=sorted.length?sorted.map(item).join(""):
    `<div class="empty"><b>Долгов пока нет</b><p class="note">Нажмите «Добавить долг» и впишите первый: сколько должны, платёж и дату.</p></div>`;
}
function item(d){
  const done=d.balance<=0.005;
  const late=!done&&d.nextDate&&d.nextDate<today;
  const when=done?"Погашен":d.nextDate?(late?"Просрочен с "+dLabel(d.nextDate):(d.nextDate===today?"Сегодня":dLabel(d.nextDate))):"Дата не указана";
  return `<div class="debt${done?" done":""}">
    <button class="debt-top" data-act="edit" data-id="${esc(d.id)}"><span><span class="n">${esc(d.name)}</span><br><span class="b">${esc(d.bank||"")}</span></span><span class="sum">${money(d.balance)}</span></button>
    <div class="debt-bottom"><span class="when${late?" late":""}">${d.payment&&!done?"Платёж "+money(d.payment)+" · ":""}${when}</span>${done?"":`<button class="pay" data-act="pay" data-id="${esc(d.id)}">Оплатил</button>`}</div>
  </div>`;
}
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};

/* ---------- шторка ---------- */
let sheet=null;
function openSheet(title,html,onSave,onDelete){
  sheet={onSave,onDelete,armed:false};
  $("sheet").innerHTML=`<div class="sheet-h"><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
    <form id="f" novalidate>${html}<div class="err" id="err"></div>
    <button class="primary" type="submit">Сохранить</button>
    ${onDelete?`<button class="danger" type="button" data-act="del" style="margin-top:8px">Удалить долг</button>`:""}</form>`;
  $("scrim").hidden=false;
}
function closeSheet(){$("scrim").hidden=true;sheet=null}
const field=(k,label,val,o={})=>`<label class="field${o.half?" half":""}"><span class="label">${label}</span><input class="in" id="${k}" name="${k}" type="${o.type||"text"}"${o.num?' inputmode="decimal"':""} value="${esc(val==null?"":String(val).replace(o.num?".":"\u0000",","))}" placeholder="${esc(o.ph||"")}" autocomplete="off">${o.hint?`<span class="hint">${o.hint}</span>`:""}</label>`;

function debtForm(d){
  const v=d||{name:"",bank:"",balance:"",payment:"",nextDate:"",monthly:true};
  openSheet(d?"Долг":"Новый долг",`<div class="fields">
    ${field("name","Название",v.name,{ph:"Например, кредитка Т-Банка"})}
    ${field("bank","Кому должен",v.bank,{ph:"Банк или человек, необязательно"})}
    ${field("balance","Сколько должен, ₽",v.balance,{num:true,half:true})}
    ${field("payment","Платёж, ₽",v.payment,{num:true,half:true,hint:"Необязательно"})}
    ${field("nextDate","Следующий платёж",v.nextDate,{type:"date",hint:"Необязательно"})}
    <label class="check"><input type="checkbox" id="monthly" ${v.monthly!==false?"checked":""}> Платёж каждый месяц</label>
    </div>
    ${d&&(d.payments||[]).length?`<span class="label">Оплаты</span><div class="hist">${d.payments.slice().reverse().map(p=>`<div><span>${dLabel(p.date)}</span><b>${money(p.amount)}</b></div>`).join("")}</div>`:""}`,
    ()=>{
      const name=$("name").value.trim();if(!name)return "Введите название.";
      const bal=parseNum($("balance").value);if(!isFinite(bal)||bal<0)return "Введите, сколько должны.";
      const pay=parseNum($("payment").value);
      const o={...(d||{id:uid(),payments:[],created:Date.now()}),name,bank:$("bank").value.trim(),balance:r2(bal),
        payment:isFinite(pay)&&pay>0?r2(pay):null,nextDate:$("nextDate").value||"",monthly:$("monthly").checked};
      const i=debts.findIndex(x=>x.id===o.id);if(i>=0)debts[i]=o;else debts.push(o);
      save();
    },
    d?()=>{debts=debts.filter(x=>x.id!==d.id);save()}:null);
}
function payForm(d){
  openSheet("Оплата: "+d.name,`<div class="fields">
    ${field("amount","Сколько заплатил, ₽",d.payment||"",{num:true,half:true})}
    ${field("date","Когда",today,{type:"date",half:true})}
    </div><p class="note">Сумма вычтется из долга${d.monthly!==false&&d.nextDate?", следующий платёж переедет на "+dLabel(nextMonth(d.nextDate)):""}.</p>`,
    ()=>{
      const a=parseNum($("amount").value);if(!isFinite(a)||a<=0)return "Введите сумму.";
      d.payments=(d.payments||[]).concat({id:uid(),date:$("date").value||today,amount:r2(a)});
      d.balance=r2(Math.max(0,d.balance-a));
      if(d.monthly!==false&&d.nextDate)d.nextDate=nextMonth(d.nextDate);
      save();
    });
}

/* ---------- нажатия ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(e.target===$("scrim")){closeSheet();return}
  if(!a)return;
  const d=debts.find(x=>x.id===a.dataset.id);
  switch(a.dataset.act){
    case "close":closeSheet();break;
    case "edit":if(d)debtForm(d);break;
    case "pay":if(d)payForm(d);break;
    case "del":
      if(!sheet.armed){sheet.armed=true;a.classList.add("armed");a.textContent="Нажмите ещё раз, чтобы удалить";break}
      sheet.onDelete();closeSheet();break;
  }
});
$("add").addEventListener("click",()=>debtForm(null));
$("sheet").addEventListener("submit",e=>{
  e.preventDefault();if(!sheet)return;
  const err=sheet.onSave();
  if(err){$("err").textContent=err;return}
  closeSheet();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSheet()});

/* ---------- Telegram ---------- */
if(TG){
  try{TG.ready();TG.expand();if(TG.isVersionAtLeast&&TG.isVersionAtLeast("7.7")&&TG.disableVerticalSwipes)TG.disableVerticalSwipes()}catch(e){}
  const theme=()=>{document.documentElement.dataset.theme=TG.colorScheme==="dark"?"dark":"light";try{const c=TG.colorScheme==="dark"?"#0F1512":"#EDF0EA";TG.setHeaderColor(c);TG.setBackgroundColor(c)}catch(e){}};
  theme();try{TG.onEvent("themeChanged",theme)}catch(e){}
}
load();
})();
</script>
</body>
</html>
