<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Кошелёк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FAFBF8; --surface-2:#E2E7DF; --ink:#16211C; --muted:#667068; --line:#D3DAD0;
  --accent:#0F6B5A; --accent-ink:#F4FAF7; --in:#23845A; --out:#B9473B; --warn:#B7791F;
  --c-min:#8A948D; --c-av:#0F6B5A; --c-sn:#6750C8;
  --shadow:0 1px 2px rgba(22,33,28,.06),0 8px 24px rgba(22,33,28,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512; --surface:#171F1B; --surface-2:#212B26; --ink:#E3EAE5; --muted:#8E9A93; --line:#2A3530;
    --accent:#4DBE9F; --accent-ink:#0B1411; --in:#5CC98E; --out:#EE7F70; --warn:#E3AC4F;
    --c-min:#7D8982; --c-av:#4DBE9F; --c-sn:#A696F2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512; --surface:#171F1B; --surface-2:#212B26; --ink:#E3EAE5; --muted:#8E9A93; --line:#2A3530;
  --accent:#4DBE9F; --accent-ink:#0B1411; --in:#5CC98E; --out:#EE7F70; --warn:#E3AC4F;
  --c-min:#7D8982; --c-av:#4DBE9F; --c-sn:#A696F2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:12px 150px;font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;width:100%;min-width:0}
h1,h2,h3{font-family:Unbounded,"Golos Text",system-ui,sans-serif;margin:0;text-wrap:balance;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.pos{color:var(--in)} .neg{color:var(--out)} .warn-t{color:var(--warn)}

.top{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.brand{font-family:Unbounded,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--in)}

.hero{display:flex;flex-direction:column;gap:4px}
.hero .num{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(28px,8.5vw,38px);letter-spacing:-.02em;line-height:1.1}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio div,.duo div{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.trio b,.duo b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo b{font-size:18px}

.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h h2{font-size:14px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px}
.demo{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px}
.note{font-size:13px;color:var(--muted)}
.alert{border-radius:12px;padding:10px 12px;font-size:13px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));}
.alert.bad{background:color-mix(in srgb,var(--out) 14%,var(--surface))}
.empty{color:var(--muted);font-size:14px;margin:0}

.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--out)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}

.month{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.month button{border:0;background:transparent;width:40px;height:40px;border-radius:10px;font-size:20px}
.month button:hover{background:var(--surface-2)}
.month .m{font-weight:600;text-transform:capitalize}

.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.cat .b{grid-column:1/-1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cat .b i{display:block;height:100%;background:var(--accent);opacity:.85}
.cat .v{font-weight:600}
.pct{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}

.days{display:flex;flex-direction:column;gap:14px}
.day{display:flex;flex-direction:column;gap:2px}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 2px 4px;border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border:0;background:none;text-align:left;width:100%;border-radius:10px}
button.item:hover{background:var(--surface-2)}
.ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--surface-2);color:var(--muted)}
.ic.in{color:var(--in)} .ic.dbt{color:var(--out)} .ic.sub{color:var(--c-sn)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t span:last-child{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:600;white-space:nowrap;text-align:right}
.item .a.in{color:var(--in)}
.item .a small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.mini.done{background:var(--surface-2);color:var(--muted);border-color:transparent}

.debt{border:0;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.debt:hover{outline:1px solid var(--line)}
.debt-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.debt-top .n{font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.card{color:var(--out)} .pill.loan{color:var(--accent)} .pill.installment{color:var(--c-sn)} .pill.kub{color:var(--warn)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.debt-sum{font-family:Unbounded,sans-serif;font-size:22px;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px}
.kv span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv b{font-weight:600}

.strats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.strat{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.strat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.strat .sw{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.strat .sw i{width:10px;height:3px;border-radius:2px;display:inline-block}
.strat b{font-size:15px}
.strat small{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider-val{font-family:Unbounded,sans-serif;font-size:22px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:"Golos Text",system-ui,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:430px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.m{text-transform:capitalize;font-weight:600}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:520px}
.tabs button{border:0;background:none;padding:6px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;padding:13px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(15,107,90,.35)}

.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:17px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields>*{grid-column:1/-1;min-width:0}
.fields>.half{grid-column:auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:4px}
.amount:focus-within{border-color:var(--accent)}
.amount input{border:0;background:none;font-family:Unbounded,sans-serif;font-size:32px;width:100%;min-width:0;padding:0;color:var(--ink)}
.amount input:focus{outline:none}
.amount span{font-family:Unbounded,sans-serif;font-size:22px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:5px}
.hint{font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
input.in,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:14px;border-radius:12px;font-size:16px;width:100%}
.ghost{border:1px solid var(--line);background:none;padding:12px 14px;border-radius:12px;font-weight:600;width:100%}
.danger{border:1px solid var(--line);background:none;color:var(--out);font-weight:600;padding:12px;border-radius:12px;width:100%}
.danger.armed{background:var(--out);color:#fff;border-color:var(--out)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.err{color:var(--out);font-size:13px;min-height:1em}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;font-size:14px}
.facts span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.facts b{font-weight:600}
.list{display:flex;flex-direction:column}
.budget-edit{display:flex;gap:8px}
.budget-edit input{flex:1}
.budget-edit button{width:auto}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">Кошелёк</span>
    <span class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Загрузка…</span></span>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab">+ Операция</button>

<nav class="tabs" aria-label="Разделы"><div role="tablist">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Обзор</button>
  <button role="tab" data-tab="ops" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Операции</button>
  <button role="tab" data-tab="debts" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Долги</button>
  <button role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>План</button>
  <button role="tab" data-tab="save" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 12a7 6 0 0 1 14 0v4H5z"/><path d="M8 16v3M16 16v3M12 6V4"/></svg>Копилка</button>
</div></nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script>
/* Расчётное ядро: даты, проценты, долги, стратегии, вклады. Чистые функции. */
(function(root){
const DAY=86400000;
const p2=(n)=>String(n).padStart(2,"0");
const r2=(x)=>Math.round(x*100)/100;
function D(s){const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}
function S(t){const d=new Date(t);return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())}
const isLeap=(y)=>y%4===0&&(y%100!==0||y%400===0);
const days=(a,b)=>Math.round((D(b)-D(a))/DAY);
const addDays=(s,n)=>S(D(s)+n*DAY);
const mkOf=(s)=>s.slice(0,7);
function addMonths(mk,n){let [y,m]=mk.split("-").map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+p2(m)}
const monthLen=(mk)=>{const [y,m]=mk.split("-").map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate()};
const dueIn=(mk,day)=>mk+"-"+p2(Math.min(Math.max(1,day|0),monthLen(mk)));
function nextDueAfter(after,day){const d=dueIn(mkOf(after),day);return d>after?d:dueIn(addMonths(mkOf(after),1),day)}
const monthsBetween=(a,b)=>{const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+(m2-m1)};

/* Проценты по дням: остаток × ставка × дни / дней в году (365 или 366). */
function accrue(bal,rate,from,to){
  if(!(bal>0)||!(rate>0)||!(to>from))return 0;
  let sum=0,cur=from;
  while(cur<to){
    const y=+cur.slice(0,4), yEnd=(y+1)+"-01-01", seg=to<yEnd?to:yEnd;
    sum+=bal*rate/100*days(cur,seg)/(isLeap(y)?366:365);
    cur=seg;
  }
  return sum;
}
function annuity(sum,rate,n,py){
  if(!(sum>0))return 0; if(!(n>0))return sum;
  const i=rate/100/(py||12); if(!i)return sum/n;
  return sum*i/(1-Math.pow(1+i,-n));
}
/* Сколько месяцев нужно, чтобы погасить sum платежом pay. Infinity, если платёж не покрывает проценты. */
function termFor(sum,rate,pay,py){
  if(!(sum>0))return 0; if(!(pay>0))return Infinity;
  const i=rate/100/(py||12); if(!i)return Math.ceil(sum/pay-1e-9);
  if(pay<=sum*i)return Infinity;
  const n=-Math.log(1-sum*i/pay)/Math.log(1+i);
  /* Платёж в банке округлён до копеек, поэтому хвост меньше 2% платежа не считаем отдельным месяцем. */
  return Math.max(1,n-Math.floor(n)<0.02?Math.floor(n):Math.ceil(n));
}

/* Начальное состояние долга, из которого считаются и «сегодня», и прогноз. */
function initState(d){
  const st={id:d.id,name:d.name,kind:d.kind,rate:+d.rate||0,payDay:+d.payDay||1,fees:+d.fees||0,
    principal:+d.balance||0,carry:0,last:d.balanceDate,lastRegular:null,
    termLeft:Math.max(0,+d.termLeft||0),payType:d.payType||"annuity",
    minPct:+d.minPct||0,minFixed:+d.minFixed||0,retro:!!d.retroInterest,retroDone:false,
    graceStart:d.graceStart||null,graceEnd:null,payment:0,part:0,paidInt:0,paidPrin:0,history:[]};
  if(d.kind==="card"&&d.graceStart&&+d.graceDays>0)st.graceEnd=addDays(d.graceStart,+d.graceDays);
  /* Как часто платёж: раз в месяц (по дню месяца) или раз в 1–2 недели от даты ближайшего платежа. */
  st.every=d.kind==="installment"&&(d.payEvery==="w"||d.payEvery==="2w")?d.payEvery:"month";
  st.step=st.every==="w"?7:st.every==="2w"?14:0;
  st.perYear=st.every==="w"?52:st.every==="2w"?26:12;
  st.anchor=d.firstPay||d.balanceDate;
  /* Сколько платежей осталось, если известны платёж и последний платёж (или только платёж). */
  if(!st.termLeft&&d.kind!=="card"&&+d.payment>0){
    if(!(st.rate>0)&&+d.lastPayment>0)st.termLeft=Math.max(1,Math.round((st.principal-+d.lastPayment)/+d.payment)+1);
    else st.termLeft=Math.min(600,termFor(st.principal,st.rate,+d.payment,st.perYear));
  }
  if(d.kind==="loan"&&st.payType==="diff")st.part=st.termLeft?st.principal/st.termLeft:st.principal;
  else if(d.kind!=="card")st.payment=+d.payment>0?+d.payment:annuity(st.principal,st.rate,st.termLeft,st.perYear);
  return st;
}
/* Проценты с st.last до date. Для карты учитывает льготный период и начисление задним числом. Меняет st.retroDone, если mutate. */
function interestTo(st,date,mutate){
  if(!(date>st.last)||st.principal<=0)return 0;
  if(st.kind!=="card"||!st.graceEnd)return accrue(st.principal,st.rate,st.last,date);
  if(date<=st.graceEnd)return 0;
  let i=accrue(st.principal,st.rate,st.last>st.graceEnd?st.last:st.graceEnd,date);
  if(st.retro&&!st.retroDone&&st.last<=st.graceEnd){
    i+=accrue(st.principal,st.rate,st.graceStart,st.graceEnd);
    if(mutate)st.retroDone=true;
  }
  return i;
}
/* Внести платёж: сначала проценты, потом основной долг. kind: regular | early; mode: term | payment. */
function applyPayment(st,date,amount,kind,mode){
  const int=st.carry+interestTo(st,date,true);
  st.last=date;
  const toInt=Math.min(amount,int);
  st.carry=int-toInt;
  const toPrin=Math.min(st.principal,amount-toInt);
  st.principal=r2(st.principal-toPrin);
  st.paidInt+=toInt; st.paidPrin+=toPrin;
  if(kind!=="early"&&st.kind!=="card"){st.termLeft=Math.max(0,st.termLeft-1);st.lastRegular=date}
  if(kind!=="early"&&st.kind==="card")st.lastRegular=date;
  if(kind==="early"&&st.kind!=="card"&&st.principal>0){
    if(mode==="payment"){
      if(st.kind==="loan"&&st.payType==="diff")st.part=st.termLeft?st.principal/st.termLeft:st.principal;
      else st.payment=annuity(st.principal,st.rate,st.termLeft,st.perYear);
    }else{
      if(st.kind==="loan"&&st.payType==="diff")st.termLeft=Math.ceil(st.principal/st.part-1e-9);
      else st.termLeft=termFor(st.principal,st.rate,st.payment,st.perYear);
    }
  }
  st.history.push({date,amount,kind,toInt:r2(toInt),toPrin:r2(toPrin),rest:st.principal});
  return {toInt,toPrin};
}
/* Ближайшая дата платежа строго после after. */
function nextSched(st,after){
  if(!st.step)return nextDueAfter(after,st.payDay);
  if(st.anchor>after)return st.anchor;
  return addDays(st.anchor,(Math.floor(days(st.anchor,after)/st.step)+1)*st.step);
}
/* Все даты платежей в месяце mk. */
function schedIn(st,mk){
  if(!st.step)return [dueIn(mk,st.payDay)];
  const out=[];let d=nextSched(st,addDays(mk+"-01",-1));
  while(mkOf(d)===mk){out.push(d);d=addDays(d,st.step)}
  return out;
}
/* Обязательный платёж на дату date (без изменения состояния). */
function requiredAt(st,date){
  const int=st.carry+interestTo(st,date,false);
  const all=st.principal+int;
  if(st.principal<=0)return {pay:0,int};
  let pay;
  if(st.kind==="card"){
    pay=Math.max(st.principal*st.minPct/100,st.minFixed)+int;
  }else if(st.kind==="loan"&&st.payType==="diff"){
    pay=st.termLeft<=1?all:st.part+int;
  }else{
    pay=st.termLeft<=1?all:st.payment;
  }
  return {pay:r2(Math.min(pay,all)),int};
}
/* Состояние кредита или рассрочки на сегодня с учётом всех записанных платежей. */
function loanToday(d,payments,today){
  const st=initState(d);
  payments.filter(p=>p.date>=d.balanceDate&&p.date<=today)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(p=>applyPayment(st,p.date,+p.amount,p.payKind||"regular",p.earlyMode||"term"));
  const anchor=st.step?(st.lastRegular?addDays(st.lastRegular,Math.floor(st.step/2)):addDays(d.balanceDate,-1))
    :(st.lastRegular?addDays(st.lastRegular,20):d.balanceDate);
  st.nextDue=nextSched(st,anchor);
  const req=requiredAt(st,st.nextDue);
  st.nextAmount=req.pay;
  st.accruedNow=r2(st.carry+interestTo(st,today,false));
  st.overdue=st.principal>0&&st.nextDue<today;
  st.growing=st.kind!=="card"&&st.principal>0&&st.termLeft===Infinity;
  return st;
}
const clone=(st)=>Object.assign({},st,{history:[]});

/* ---------- Кредитная карта: выписки, льготный период, две ставки, рассрочки, резерв ---------- */
function lastStmtOnOrBefore(sd,date){const d=dueIn(mkOf(date),sd);return d<=date?d:dueIn(addMonths(mkOf(date),-1),sd)}
function cardTotal(s){return r2(Math.max(0,s.purch+s.cash+s.misc+s.plans.reduce((a,p)=>a+p.rem,0)))}
function cardMin(s,base,inst){
  base=Math.max(0,base);
  const m=base<=0?0:Math.min(base,Math.max(s.minFixed,base*s.minPct/100));
  return r2(m+inst);
}
/* «Цена» денег на карте для выбора стратегии: наличные всегда под свою ставку, покупки — только если льгота не соблюдается. */
function cardRate(s){
  if(s.cash>0.01)return s.rC;
  if((s.payMode==="min"||!s.graceOk)&&s.purch>0.01)return s.rP;
  return 0;
}
const cardClone=(s)=>Object.assign({},s,{plans:s.plans.map(p=>Object.assign({},p)),history:[]});
function cardInit(d){
  const legacy=!d.statementDay;
  const sd=+(d.statementDay||d.payDay)||1;
  const num=(v,def)=>v===undefined||v===null||v===""?def:+v;
  const s={id:d.id,name:d.name,kind:"card",isCard:true,sd,dueDays:num(d.dueDays,legacy?20:25),
    rP:num(d.ratePurchase,+d.rate||0),rC:num(d.rateCash,+d.rate||0),
    minPct:num(d.minPct,0),minFixed:num(d.minFixed,0),payMode:d.payMode||"grace",
    reserve:num(d.reserve,0),resPct:num(d.reserveFeePct,0),resMin:num(d.reserveFeeMin,0),svc:num(d.fees,0),
    purch:legacy?+d.balance||0:num(d.purchBal,0),cash:legacy?0:num(d.cashBal,0),misc:0,plans:[],
    t:d.balanceDate,intP:0,intC:0,pendOld:0,graceOk:true,curG:0,curM:0,due:null,paid:0,
    resOut:0,resOutDate:null,depFor:null,overdue:false,tInt:0,tFees:0,tPaid:0,sim:false,history:[]};
  (d.plans||[]).forEach(p=>{
    const amount=+p.amount||0;
    const months=+p.months>0?+p.months:(+p.monthly>0&&+p.lastPay>0?Math.max(1,Math.round((amount-+p.lastPay)/+p.monthly)+1):1);
    const monthly=+p.monthly>0?+p.monthly:Math.ceil(amount/months*100)/100;
    const first=p.first||nextDueAfter(p.date||d.balanceDate,sd);
    let billed=0;
    if(first<=d.balanceDate){let x=first;while(x<=d.balanceDate&&billed<months){billed++;x=dueIn(addMonths(mkOf(x),1),sd)}}
    const rem=billed>=months?0:Math.max(0,r2(amount-monthly*billed));
    s.plans.push({id:p.id,name:p.name,amount,months,monthly,fee:+p.fee||0,feeMonthly:p.feeMonthly!==false,
      first,left:months-billed,rem,feeDone:billed>0});
  });
  s.lastS=lastStmtOnOrBefore(sd,d.balanceDate);
  if(d.lastStmtPaid===false){
    const D=addDays(s.lastS,s.dueDays);
    if(D>=d.balanceDate){
      const inst=s.plans.filter(p=>p.first<=s.lastS&&p.left>=0).reduce((a,p)=>a+(p.left>0||p.rem===0?Math.min(p.monthly,p.amount):0)+(p.feeMonthly?p.fee:0),0);
      s.due=D;s.curG=r2(s.purch+s.cash);s.curM=Math.min(s.curG,cardMin(s,s.purch+s.cash-inst,inst));
    }
  }
  return s;
}
function cardAccrue(s,to){
  if(!(to>s.t))return;
  s.intC+=accrue(s.cash,s.rC,s.t,to);
  s.intP+=accrue(s.purch,s.rP,s.t,to);
  s.t=to;
}
/* Платёж гасит сначала проценты, комиссии и платежи по рассрочкам, потом снятия, потом покупки. Лишнее остаётся своими деньгами на карте. */
function cardPay(s,amt){
  let a=amt;
  const take=(k)=>{const x=Math.max(0,Math.min(a,s[k]));s[k]=r2(s[k]-x);a-=x};
  take("misc");take("cash");take("purch");
  if(a>0.005)s.purch=r2(s.purch-a);
}
function cardStatement(s,S){
  s.misc+=s.intC;s.tInt+=s.intC;s.intC=0;
  if(!s.graceOk){s.misc+=s.intP;s.tInt+=s.intP;s.pendOld=0}else s.pendOld=s.intP;
  s.intP=0;
  let inst=0;
  s.plans.forEach(p=>{
    if(p.left<=0||S<p.first)return;
    const a=p.left===1?p.rem:Math.min(p.monthly,p.rem);
    p.rem=r2(p.rem-a);p.left--;
    let fee=0;if(p.feeMonthly||!p.feeDone){fee=p.fee;p.feeDone=true}
    inst+=a+fee;s.tFees+=fee;
  });
  if(s.svc>0&&cardTotal(s)+inst>0.01){s.misc+=s.svc;s.tFees+=s.svc}
  s.misc=r2(s.misc+inst);
  s.curG=r2(Math.max(0,s.purch+s.cash+s.misc));
  s.curM=Math.min(s.curG,cardMin(s,s.purch+s.cash+s.misc-inst,inst));
  s.lastS=S;s.due=addDays(S,s.dueDays);s.paid=0;
}
function cardDue(s){
  if(s.paid+0.005>=s.curG){s.graceOk=true;s.pendOld=0}
  else{s.graceOk=false;s.misc+=s.pendOld;s.tInt+=s.pendOld;s.pendOld=0}
  s.overdue=s.paid+0.005<s.curM;
  s.due=null;
}
function cardNextDue(s){return s.due||addDays(nextDueAfter(s.lastS,s.sd),s.dueDays)}
/* Прогнать карту по дням до даты until включительно. evs: {date, type: buy|cash|pay, amount}. */
function cardRun(s,until,evs){
  evs=(evs||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  let i=0;
  for(let g=0;g<20000;g++){
    const nS=nextDueAfter(s.lastS,s.sd);
    const c=[];
    if(s.reserve>0&&s.depFor!==nS)c.push([addDays(nS,-1),0,"dep"]);
    if(i<evs.length)c.push([evs[i].date,1,"ev"]);
    if(s.due)c.push([s.due,2,"due"]);
    c.push([nS,3,"stmt"]);
    if(s.resOut>0)c.push([s.resOutDate,4,"wd"]);
    c.sort((a,b)=>a[0].localeCompare(b[0])||a[1]-b[1]);
    const [date,,type]=c[0];
    if(date>until)break;
    cardAccrue(s,date);
    if(type==="dep"){
      s.depFor=nS;
      const other=Math.max(0,s.purch)+s.misc+s.plans.reduce((a,p)=>a+p.rem,0);
      if(s.sim&&other<=0.01){s.reserve=0;continue}
      const R=Math.max(0,Math.min(s.reserve,s.purch+s.cash+s.misc));
      if(R>0){cardPay(s,R);s.resOut=R;s.resOutDate=addDays(nS,1)}
    }else if(type==="ev"){
      const e=evs[i++],amt=+e.amount||0;
      if(e.type==="pay"){cardPay(s,amt);s.tPaid+=amt;if(s.due)s.paid+=amt;s.history.push({date:e.date,amount:amt})}
      else if(e.type==="cash"){let a=amt;if(s.purch<0){const u=Math.min(-s.purch,a);s.purch+=u;a-=u}s.cash=r2(s.cash+a)}
      else s.purch=r2(s.purch+amt);
    }else if(type==="due")cardDue(s);
    else if(type==="stmt")cardStatement(s,nS);
    else if(type==="wd"){
      const fee=s.resPct>0||s.resMin>0?Math.max(s.resOut*s.resPct/100,s.resMin):0;
      s.cash=r2(s.cash+s.resOut);if(fee){s.misc+=fee;s.tFees+=fee}
      s.resOut=0;s.resOutDate=null;
    }
  }
  cardAccrue(s,until);
  return s;
}
function cardToday(d,payments,spends,today){
  const s=cardInit(d);
  const evs=payments.map(p=>({date:p.date,type:"pay",amount:+p.amount}))
    .concat((spends||[]).map(x=>({date:x.date,type:x.op==="cash"?"cash":"buy",amount:+x.amount})))
    .filter(e=>e.date>=d.balanceDate&&e.date<=today);
  cardRun(s,today,evs);
  let G,M,paid,D;
  if(s.due){D=s.due;G=s.curG;M=s.curM;paid=s.paid}
  else{const c=cardClone(s);D=cardNextDue(c);cardRun(c,addDays(D,-1));G=c.curG;M=c.curM;paid=0;s.previewS=c.lastS}
  s.nextDue=D;s.nextG=r2(Math.max(0,G-paid));s.nextM=r2(Math.max(0,M-paid));
  s.nextAmount=s.payMode==="min"?s.nextM:s.nextG;
  s.principal=cardTotal(s);
  s.accruedNow=r2(s.intC+(s.graceOk?0:s.intP));
  s.atRisk=r2(s.pendOld+s.intP+accrue(Math.max(0,s.purch),s.rP,today,D));
  s.rate=cardRate(s);s.paidPrin=s.tPaid;s.paidInt=0;s.termLeft=0;s.growing=false;
  s.plansRem=r2(s.plans.reduce((a,p)=>a+p.rem,0));
  return s;
}
/* ---------- Рассрочка с разными платежами по графику банка ---------- */
function customToday(d,payments,today){
  const rows=(d.schedule||[]).map(r=>({id:r.id,date:r.date,amount:+r.amount||0,fee:+r.fee||0}))
    .filter(r=>r.date).sort((a,b)=>a.date.localeCompare(b.date));
  const before=rows.filter(r=>r.date<d.balanceDate).length;
  const pays=payments.filter(p=>p.date>=d.balanceDate&&p.date<=today);
  const paid=Math.min(rows.length,before+pays.length);
  const rest=rows.slice(paid);
  return {id:d.id,name:d.name,kind:"installment",isCustom:true,rows:rest,allRows:rows,paidCount:paid,
    rate:0,perYear:12,fees:0,carry:0,history:[],
    principal:r2(rest.reduce((a,r)=>a+r.amount-r.fee,0)),feesLeft:r2(rest.reduce((a,r)=>a+r.fee,0)),
    toPay:r2(rest.reduce((a,r)=>a+r.amount,0)),
    nextDue:rest[0]?rest[0].date:null,nextAmount:rest[0]?rest[0].amount:0,termLeft:rest.length,
    accruedNow:0,overdue:!!rest[0]&&rest[0].date<today,growing:false,
    paidPrin:rows.slice(0,paid).reduce((a,r)=>a+r.amount,0),paidInt:0,lastRow:rows[rows.length-1]||null};
}

/* ---------- Кубышка Т-Банка ----------
   Если вернуть всё за бесплатные дни — бесплатно. Если нет, комиссия начисляется за каждый день
   с даты, когда взяли (ступени по сумме долга, но не больше 0,8% долга в день).
   Начисленное 1-го числа нужно погасить до 25-го, иначе сверху штраф 20% годовых. */
const KUB_TIERS="1000:0; 3000:8; 10000:19; 25000:39; 59";
const KUB_OLD="1000:0; 3000:9; 10000:19; 25000:39; 59";
function parseTiers(str){
  if(!str||str===KUB_OLD)str=KUB_TIERS;
  const out=[];
  String(str).split(/[;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
    const m=p.replace(/\s/g,"").replace(",",".").split(":");
    if(m.length===2)out.push({upTo:+m[0],fee:+m[1]});else out.push({upTo:Infinity,fee:+m[0]});
  });
  out.sort((a,b)=>a.upTo-b.upTo);
  if(!out.length||out[out.length-1].upTo!==Infinity)out.push({upTo:Infinity,fee:out.length?out[out.length-1].fee:0});
  return out;
}
function kubDayFee(s,bal){
  if(!(bal>0.005))return 0;
  let f=0;for(const t of s.tiers)if(bal<=t.upTo){f=t.fee||0;break}
  return Math.min(f,bal*s.capPct/100);
}
/* Прогнать Кубышку по дням до даты to (дни [s.t, to)). */
function kubAdvance(s,to){
  let guard=0;
  while(s.t<to&&guard++<4000){
    if(s.t===s.freeEnd&&s.pend>0){s.misc+=s.pend;s.tFees+=s.pend;s.pend=0}
    const owed=s.principal+s.misc;
    if(owed<=0.005){s.t=to;break}
    const fee=kubDayFee(s,s.principal);
    if(s.t<s.freeEnd)s.pend+=fee;else{s.misc+=fee;s.tFees+=fee}
    if(s.t>=s.penStart){const p=owed*s.penRate/100/365;s.misc+=p;s.tFees+=p;s.tPen+=p}
    s.t=addDays(s.t,1);
  }
  if(s.t===s.freeEnd&&s.pend>0&&s.principal>0){s.misc+=s.pend;s.tFees+=s.pend;s.pend=0}
}
function kubPay(s,amt){
  const x=Math.min(amt,s.misc);s.misc=r2(s.misc-x);amt-=x;
  const y=Math.min(amt,s.principal);s.principal=r2(s.principal-y);s.paidPrin+=x+y;
  if(s.principal<=0.005&&s.t<s.freeEnd)s.pend=0;
}
function kubInit(d){
  const taken=d.takenDate||d.balanceDate;
  const s={id:d.id,name:d.name,kind:"kub",isKub:true,principal:+d.balance||0,taken,freeDays:+d.freeDays||7,
    tiers:parseTiers(d.tiers),capPct:d.capPct!=null&&d.capPct!==""?+d.capPct:0.8,penRate:d.penaltyRate!=null&&d.penaltyRate!==""?+d.penaltyRate:20,
    misc:0,pend:0,t:taken,tFees:0,tPen:0,paidPrin:0,paidInt:0,history:[],perYear:12,fees:0,carry:0,termLeft:1,growing:false};
  s.freeEnd=addDays(taken,s.freeDays);
  s.lastFree=addDays(s.freeEnd,-1);
  s.billDate=nextDueAfter(addDays(s.freeEnd,-1),1);
  s.billDue=dueIn(mkOf(s.billDate),25);
  s.penStart=addDays(s.billDue,1);
  return s;
}
const kubClone=(s)=>Object.assign({},s,{history:[]});
function kubToday(d,payments,today){
  const s=kubInit(d);
  payments.filter(p=>p.date>=s.taken&&p.date<=today).sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(p=>{kubAdvance(s,p.date);kubPay(s,+p.amount)});
  kubAdvance(s,today);
  const plan=d.planDate&&d.planDate>=today?d.planDate:(s.lastFree>=today?s.lastFree:today);
  s.planDate=plan;s.nextDue=plan;
  const c=kubClone(s);kubAdvance(c,plan);
  s.nextAmount=r2(c.principal+c.misc);
  s.accruedNow=r2(s.misc);
  s.pendNow=r2(s.pend);
  /* Сколько спишут разом, если не вернуть в бесплатные дни. */
  s.lateCost=r2(s.pend+kubDayFee(s,s.principal)*Math.max(0,days(s.t,s.freeEnd)));
  s.dayFee=kubDayFee(s,s.principal);
  s.rate=s.principal>0?r2(s.dayFee*365/s.principal*100):0;
  s.paying=today>=s.freeEnd&&s.principal+s.misc>0.005;
  s.penalty=today>=s.penStart&&s.principal+s.misc>0.005;
  s.overdue=false;
  return s;
}

function debtToday(d,payments,today,spends){
  if(d.kind==="card")return cardToday(d,payments,spends,today);
  if(d.kind==="kub")return kubToday(d,payments,today);
  if(d.kind==="installment"&&d.payPlan==="custom")return customToday(d,payments,today);
  return loanToday(d,payments,today);
}

/* Помесячная симуляция всех долгов. strategy: min | avalanche | snowball. extra — доплата в месяц. */
function simulate(states,extra,strategy,startMk,horizon){
  horizon=horizon||600;
  const open=(s)=>s.isCard?cardTotal(s)>0.01:s.isCustom?s.rows.length>0:s.isKub?s.principal+s.misc>0.005:s.principal>0;
  const ds=states.filter(open).map(s=>{
    if(s.isCard){const c=cardClone(s);c.sim=true;return c}
    if(s.isCustom)return Object.assign({},s,{rows:s.rows.slice()});
    return clone(s);
  });
  const base={};
  /* Кубышка возвращается разом, поэтому после неё ежемесячно ничего не освобождается. */
  ds.forEach(s=>{base[s.id]=s.isKub?0:s.isCard||s.isCustom?s.nextAmount:requiredAt(s,s.nextDue).pay*(s.perYear||12)/12});
  const months=[],payoff={};
  let interest=0,fees=0,freed=0;
  const useExtra=strategy!=="min";
  for(let k=0;k<horizon&&ds.some(open);k++){
    const mk=addMonths(startMk,k),mEnd=dueIn(mk,31);
    const row={mk,per:{},pay:0,int:0,fees:0};
    const targets=[],cardDues=[];
    ds.forEach(s=>{
      if(!open(s))return;
      if(s.isCard){
        const D=cardNextDue(s);
        if(D>mEnd)return;
        const t0=s.tInt,f0=s.tFees;
        cardRun(s,addDays(D,-1));
        if(!s.due){return}
        const left=Math.max(0,s.curG-s.paid),req=s.payMode==="min"?Math.min(left,Math.max(0,s.curM-s.paid)):left;
        const e={s,D,req,extra:0,t0,f0,cap:Math.max(0,left-req)};
        cardDues.push(e);targets.push({rate:cardRate(s),bal:cardTotal(s),card:e});
        return;
      }
      if(s.isCustom){
        const due=s.rows.filter(r=>r.date<=mEnd);
        if(!due.length)return;
        const p=row.per[s.id]={pay:0,int:0,prin:0,due:due[0].date,dues:[]};
        due.forEach(r=>{
          s.rows.shift();const prin=r.amount-r.fee;s.principal=r2(s.principal-prin);
          p.pay+=r.amount;p.prin+=prin;fees+=r.fee;row.fees+=r.fee;row.pay+=r.amount;
          p.dues.push({date:r.date,pay:r.amount,int:0,prin,fee:r.fee,rest:s.principal});
        });
        return;
      }
      if(s.isKub){
        if(s.planDate<=mEnd){
          const f0=s.tFees;kubAdvance(s,s.planDate);
          const P=r2(s.principal+s.misc);kubPay(s,P);
          const dF=s.tFees-f0;fees+=dF;row.fees+=dF;row.pay+=P;
          row.per[s.id]={pay:P,int:0,prin:P-dF,due:s.planDate,fee:dF};
        }else targets.push({rate:s.rate,bal:s.principal,kub:s,mk});
        return;
      }
      const dues=schedIn(s,mk).filter(x=>x>=s.nextDue);
      if(!dues.length)return;
      let p=null;
      for(const due of dues){
        if(s.principal<=0)break;
        const req=requiredAt(s,due);
        const r=applyPayment(s,due,req.pay,"regular");
        interest+=r.toInt;row.int+=r.toInt;row.pay+=req.pay;
        if(!p)p=row.per[s.id]={pay:0,int:0,prin:0,due,dues:[]};
        p.pay+=req.pay;p.int+=r.toInt;p.prin+=r.toPrin;
        p.dues.push({date:due,pay:req.pay,int:r.toInt,prin:r.toPrin,rest:s.principal});
      }
      if(!p)return;
      const f=s.fees;fees+=f;row.fees+=f;p.pay+=f;row.pay+=f;
      if(s.principal>0)targets.push({rate:s.rate,bal:s.principal,loan:s});
    });

      let pool=extra+freed;
      targets.sort(strategy==="snowball"?(a,b)=>a.bal-b.bal||b.rate-a.rate:(a,b)=>b.rate-a.rate||a.bal-b.bal);

        if(pool<=0.005)break;
        if(t.card){const amt=Math.min(pool,t.card.cap);t.card.extra+=amt;pool-=amt;continue}
        if(t.kub){
          const s=t.kub,dt=dueIn(t.mk,15)>s.t?dueIn(t.mk,15):s.t,f0=s.tFees;
          kubAdvance(s,dt);const amt=Math.min(pool,s.principal+s.misc);kubPay(s,amt);
          const dF=s.tFees-f0;fees+=dF;row.fees+=dF;row.pay+=amt;pool-=amt;
          row.per[s.id]={pay:amt,int:0,prin:amt,due:dt,fee:dF};
          if(s.principal>0){s.dayFee=kubDayFee(s,s.principal);s.rate=r2(s.dayFee*365/s.principal*100)}
          continue;
        }
        const s=t.loan,amt=Math.min(pool,s.principal+s.carry);
        const r=applyPayment(s,s.last,amt,"early","term");
        interest+=r.toInt;row.int+=r.toInt;
        row.per[s.id].pay+=amt;row.per[s.id].int+=r.toInt;row.per[s.id].prin+=r.toPrin;
        row.pay+=amt;pool-=amt;
      }
    }
    cardDues.forEach(e=>{
      const s=e.s,P=r2(e.req+e.extra);
      cardRun(s,e.D,[{date:e.D,type:"pay",amount:P}]);
      const dI=s.tInt-e.t0,dF=s.tFees-e.f0;
      interest+=dI;fees+=dF;row.int+=dI;row.fees+=dF;
      row.per[s.id]={pay:P,int:dI,prin:Math.max(0,P-dI-dF),due:e.D,card:true};
      row.pay+=P;
    });
    ds.forEach(s=>{
      if(!open(s)&&!payoff[s.id]&&row.per[s.id]){payoff[s.id]=mk;if(useExtra)freed+=base[s.id]||0}
      if(row.per[s.id]&&!s.isCustom)row.per[s.id].rest=s.isCard?cardTotal(s):s.principal;
    });
    row.total=r2(ds.reduce((a,s)=>a+(s.isCard?cardTotal(s):s.principal),0));
    months.push(row);
  }
  const stuck=ds.some(open);
  return {months,payoff,interest:r2(interest),fees:r2(fees),freeMk:stuck?null:(months.length?months[months.length-1].mk:startMk),stuck};
}

/* Вклад / накопительный счёт. cap: day | month | quarter | end. Возвращает значения по месяцам. */
function grow(balance,rate,cap,months,topUp){
  const r=rate/100; topUp=topUp||0;
  const mRate=cap==="day"?Math.pow(1+r/365,365/12)-1:r/12;
  let bal=balance,pending=0,interest=0;const series=[bal];
  for(let k=1;k<=months;k++){
    const i=bal*mRate; interest+=i;
    if(cap==="day"||cap==="month")bal+=i;
    else{pending+=i;if((cap==="quarter"&&k%3===0)||(cap==="end"&&k===months)){bal+=pending;pending=0}}
    bal+=topUp;
    series.push(bal+pending);
  }
  return {final:r2(bal+pending),interest:r2(interest),series};
}
/* Эффективная годовая доходность с учётом капитализации. */
function effYield(rate,cap){return (grow(100,rate,cap,12,0).final-100)}

function paysFor(id){return data.tx.filter(t=>t.debtId===id).map(t=>({date:t.date,amount:t.amount,payKind:t.payKind,earlyMode:t.earlyMode}))}
function spendsFor(id){return data.tx.filter(t=>t.cardId===id&&t.cardOp!=="inst").map(t=>({date:t.date,amount:t.amount,op:t.cardOp}))}

}
function subFor(s,mk){
  if(s.active===false||!s.nextDate)return 0;

  if(n<0)return 0;

/* события на ближайшие N дней */
function events(n){

  view("subs").forEach(s=>{
    if(s.active===false||!s.nextDate)return;
    let d=s.nextDate,guard=0;
    if(d<today)out.push({date:d,kind:"sub",id:s.id,name:s.name,amount:+s.amount,late:true});
    while(d<=end&&guard++<40){if(d>=today)out.push({date:d,kind:"sub",id:s.id,name:s.name,amount:+s.amount});d=nextSubDate(s,d)}
  });
  view("income").forEach(i=>{
    for(let k=0;k<=2;k++){
      const mk=F.addMonths(curMk,k),amt=incomeFor(i,mk),d=F.dueIn(mk,+i.day||1);
      if(amt>0&&d>=today&&d<=end)out.push({date:d,kind:"in",id:i.id,name:i.name,amount:amt});
    }
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.kind==="in"?1:-1));
}
function nextSubDate(s,d){
  const mk=F.addMonths(d.slice(0,7),s.period==="year"?12:1);
  return F.dueIn(mk,+d.slice(8));
}
function paidFor(ev){
  if(ev.kind==="debt"){const st=C.states.find(x=>x.id===ev.id),w=st&&st.step?Math.floor(st.step/2):20;return data.tx.some(t=>t.debtId===ev.id&&t.payKind!=="early"&&Math.abs(F.days(ev.date,t.date))<=w)}
  if(ev.kind==="in")return data.tx.some(t=>t.planId===ev.id&&t.date.slice(0,7)===ev.date.slice(0,7));
  return false;
}

function chart(){
  const s=C.sims, W=340,H=170,L=44,R=8,T=10,B=22;
  const series=["min","avalanche","snowball"].map(k=>[C.debtTotal].concat(s[k].months.map(r=>r.total)));
  const n=Math.max(...series.map(x=>x.length))-1||1;
  const maxV=Math.max(...series.flat(),1);
  const step=niceStep(maxV/3), top=Math.ceil(maxV/step)*step;
  const x=(i)=>L+(W-L-R)*i/n, y=(v)=>T+(H-T-B)*(1-v/top);
  let g="";
  for(let v=0;v<=top+1e-6;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${short(v)}</text>`}
  const yrs=[];for(let i=0;i<=n;i++){const mk=F.addMonths(curMk,i);if(i===0||(mk.endsWith("-01")&&i>=Math.max(6,n*0.18)))yrs.push([i,i===0?mkLabel(mk):mk.slice(0,4)])}
  const every=Math.ceil(yrs.length/5);
  yrs.forEach(([i,l],j)=>{if(j%every===0)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":"middle"}">${esc(l)}</text>`});
  const col={0:"var(--c-min)",1:"var(--c-av)",2:"var(--c-sn)"};
  const paths=[0,2,1].map(si=>[series[si],si]).map(([ser,si])=>`<path d="${ser.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join("")}" fill="none" stroke="${col[si]}" stroke-width="${si===0?1.6:2.2}" stroke-linejoin="round"${si===0?' stroke-dasharray="4 3"':""}/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Общий долг по месяцам для трёх стратегий">${g}${paths}</svg>`;
}
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function short(v){return v>=1e6?fmt2.format(F.r2(v/1e6))+" млн":v>=1e3?fmt0.format(v/1e3)+" тыс":fmt0.format(v)}

      <div class="facts"><div><span>${esc(worst.name)}</span><b class="neg">${pct(worst.rate)}</b></div><div><span>${esc(best.name)}${settings.tax?", после НДФЛ":""}</span><b class="pos">${pct(best.effNet)}</b></div></div>
      <p style="margin:0">${m0(amt)} досрочно в «${esc(worst.name)}» сэкономят около <b>${m0(debtGain)}</b> процентов за год. На «${esc(best.name)}» эти деньги принесут около <b>${m0(saveGain)}</b>.</p>
      <div class="alert ${better?"":""}" style="background:color-mix(in srgb,var(--${better?"out":"in"}) 12%,var(--surface))">${better?"Выгоднее гасить долг. Держите на счёте только подушку на 2–3 месяца расходов, остальное направляйте в долги.":"Вклад приносит больше, чем стоит долг. Можно копить и платить по графику."}</div>
      <label class="check"><input type="checkbox" id="taxBox" ${settings.tax?"checked":""}> <span>Учитывать НДФЛ 13% с процентов. Налог платится с дохода выше необлагаемого лимита (1 млн ₽ × максимальная ключевая ставка за год), поэтому с небольших сумм его может не быть.</span></label>
    </section>`;
  }
  return `
  ${demoNote(["savings"],"Сейчас показаны примеры. Нажмите «+ Вклад», чтобы добавить свой счёт.")}
  <section class="hero"><span class="label">В копилке</span><span class="num">${m0(C.saveTotal)}</span>
    <span class="note">С начисленными процентами на сегодня</span></section>
  ${sv.map(v=>`<button class="debt" data-act="saving" data-id="${esc(v.id)}">
    <div class="debt-top"><div><span class="pill loan">${v.endDate?"Вклад":"Счёт"}</span><div class="n" style="margin-top:6px">${esc(v.name)}</div><div class="small muted">${pct(v.rate)}, капитализация ${CAP[v.cap]||""}</div></div>
    <div style="text-align:right"><div class="debt-sum">${m0(v.now)}</div><div class="small pos">доходность ${pct(v.eff)}</div></div></div>
    <div class="kv"><div><span>${v.endDate?"К "+dLabel(v.endDate):"Через год"}</span><b>${m0(v.proj.final)}</b></div><div><span>Проценты</span><b class="pos">+${m0(v.proj.interest)}</b></div><div><span>Пополнение</span><b>${+v.topUp?m0(v.topUp)+"/мес":"—"}</b></div></div>
  </button>`).join("")||`<p class="empty">Накоплений пока нет.</p>`}
  ${cmp}`;
}

/* ---------------- шторка: формы и просмотр ---------------- */
let sheetState=null;
function closeSheet(){$("scrim").hidden=true;sheetState=null}
function openView(title,html){
  sheetState={view:true};
  $("sheet").innerHTML=`<div class="sheet-h"><h2 id="sheetTitle">${esc(title)}</h2><button type="button" class="x" data-act="close" aria-label="Закрыть">×</button></div>${html}`;
  $("scrim").hidden=false;$("sheet").scrollTop=0;
}
function openForm(o){
  sheetState={form:o,vals:{...o.values},armed:false};
  drawForm();$("scrim").hidden=false;$("sheet").scrollTop=0;
  setTimeout(()=>{const f=$("sheet").querySelector("input.big,input.in");if(f&&!o.noFocus)f.focus()},60);
}
function drawForm(){
  const {form:o,vals}=sheetState;
  const fields=o.fields.filter(f=>!f.show||f.show(vals));
  $("sheet").innerHTML=`<div class="sheet-h"><h2 id="sheetTitle">${esc(o.title)}</h2><button type="button" class="x" data-act="close" aria-label="Закрыть">×</button></div>
  <form id="sf" novalidate><div class="fields">${fields.map(f=>fieldHTML(f,vals[f.k])).join("")}</div>
  <div class="err" id="sfErr"></div>
  <div style="display:flex;flex-direction:column;gap:8px"><button class="primary" type="submit">${esc(o.saveLabel||"Сохранить")}</button>
  ${o.onDelete?`<button class="danger${sheetState.armed?" armed":""}" type="button" data-act="del">${sheetState.armed?"Нажмите ещё раз, чтобы удалить":esc(o.deleteLabel||"Удалить")}</button>`:""}</div></form>`;
}
function fieldHTML(f,v){
  const id="f_"+f.k, cls=f.half?"field half":"field";
  if(typeof f.label==="function")f={...f,label:f.label(sheetState.vals)};
  const hint=f.hint?`<span class="hint">${f.hint}</span>`:"";
  const val=v==null?"":v;
  switch(f.type){
    case "note":return `<p class="note" style="margin:0">${f.label}</p>`;
    case "big":return `<label class="amount"><input class="big" id="${id}" data-k="${f.k}" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="${esc(f.label)}" value="${esc(String(val).replace(".",","))}"><span>₽</span></label>`;
    case "seg":return `<div class="${cls}">${f.label?`<span class="label">${esc(f.label)}</span>`:""}<div class="seg" role="group">${f.opts.map(([k,l])=>`<button type="button" data-seg="${f.k}" data-v="${k}" aria-pressed="${String(v)===String(k)}">${esc(l)}</button>`).join("")}</div>${hint}</div>`;
    case "chips":return `<div class="${cls}"><span class="label">${esc(f.label)}</span><div class="chips">${f.opts.map(([k,l])=>`<button type="button" data-seg="${f.k}" data-v="${esc(k)}" aria-pressed="${v===k}">${esc(l)}</button>`).join("")}</div></div>`;
    case "select":return `<label class="${cls}"><span class="label">${esc(f.label)}</span><select id="${id}" data-k="${f.k}" data-re="1">${f.opts.map(([k,l])=>`<option value="${esc(k)}"${String(v)===String(k)?" selected":""}>${esc(l)}</option>`).join("")}</select>${hint}</label>`;
    case "check":return `<label class="check ${f.half?"half":""}"><input type="checkbox" id="${id}" data-k="${f.k}" data-re="1"${v?" checked":""}><span>${esc(f.label)}${f.hint?`<br><span class="hint">${f.hint}</span>`:""}</span></label>`;
    default:{
      const t=f.type==="date"?"date":f.type==="month"?"month":"text";
      const im=f.type==="money"||f.type==="num"?' inputmode="decimal"':f.type==="int"?' inputmode="numeric"':"";
      const shown=(f.type==="money"||f.type==="num")&&val!==""?String(val).replace(".",","):val;
      return `<label class="${cls}"><span class="label">${esc(f.label)}</span><input class="in" type="${t}" id="${id}" data-k="${f.k}"${im} placeholder="${esc(f.ph||"")}" value="${esc(shown)}" autocomplete="off"${f.max?` maxlength="${f.max}"`:""}>${hint}</label>`;
    }
  }
}
$("sheet").addEventListener("input",e=>{
  if(!sheetState||!sheetState.form)return;
  const k=e.target.dataset.k;if(!k)return;
  sheetState.vals[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;
  if(e.target.dataset.re)drawForm();
});
$("sheet").addEventListener("change",e=>{
  if(!sheetState||!sheetState.form)return;
  const k=e.target.dataset.k;if(!k||!e.target.dataset.re)return;
  sheetState.vals[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;drawForm();
});
$("sheet").addEventListener("submit",async e=>{
  e.preventDefault();
  const st=sheetState;if(!st||!st.form)return;
  const btn=e.target.querySelector(".primary");btn.disabled=true;
  try{
    const err=await st.form.onSave(st.vals);
    if(err){$("sfErr").textContent=err;btn.disabled=false;return}
    closeSheet();
  }catch(x){$("sfErr").textContent="Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.";btn.disabled=false}
});
$("scrim").addEventListener("click",e=>{if(e.target===$("scrim"))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSheet()});

const num=(v,d)=>{const n=parseNum(v);return isFinite(n)?n:(d||0)};

      {k:"payKind",type:"seg",label:"Тип платежа",show:x=>x.type==="out"&&x.cat==="Кредиты"&&debts.length>0&&plainLoan(x.debtId),opts:[["regular","По графику"],["early","Досрочно"]]},
      {k:"earlyMode",type:"seg",label:"Что уменьшить",show:x=>x.type==="out"&&x.cat==="Кредиты"&&x.payKind==="early"&&kindOf(x.debtId)!=="card",opts:[["term","Срок"],["payment","Платёж"]],hint:"Сокращение срока обычно экономит больше процентов."},
      {k:"date",type:"date",label:"Дата",half:true},

    ].map(f=>f.k==="cat"?{...f,get opts(){return (CATS[sheetState?sheetState.vals.type:v.type]||CATS.out).map(c=>[c,c])}}:f),
    onDelete:t?async()=>{await store.remove("tx",t.id);if(t.cardOp==="inst")await syncPlan(t.id,null,null)}:null,

      if(!CATS[x.type].includes(x.cat))x.cat=CATS[x.type][0];

      const o={id:t?t.id:uid(),type:x.type,amount:F.r2(num(x.amount)),cat:x.cat,note:(x.note||"").trim(),date:x.date||today,created:t&&t.created||Date.now()};

      const card=onCard(x)?cards.find(c=>c.id===x.src):null;
      let plan=null;

          const old=(card.plans||[]).find(q=>q.id===o.id);
          plan={id:o.id,name:o.note||o.cat,amount:o.amount,months:n,monthly:num(x.instMonthly)>0?F.r2(num(x.instMonthly)):0,fee:num(x.instFee),feeMonthly:true,date:o.date,
            first:old&&old.date===o.date?old.first:F.nextDueAfter(o.date,+card.statementDay||1)};

    }
  });
}

          limit:num(x.limit),purchBal:F.r2(pb),cashBal:F.r2(cb),balance:F.r2(pb+cb),lastStmtPaid:!!x.lastStmtPaid,payMode:x.payMode==="min"?"min":"grace",
          reserve:num(x.reserve),reserveFeePct:num(x.reserveFeePct),reserveFeeMin:num(x.reserveFeeMin),plans:d&&d.plans||[]});
        if(!(o.minPct>0)&&!(o.minFixed>0))return "Укажите минимальный платёж: процент от долга или сумму.";
        if(!(o.ratePurchase>=0&&o.ratePurchase<=200&&o.rateCash>=0&&o.rateCash<=200))return "Проверьте ставки.";
      }else if(x.kind==="kub"){
        const e=need(x.balance,"Введите долг по Кубышке.");if(e)return e;
        if(!x.takenDate)return "Укажите, когда взяли деньги.";
        const tiers=String(x.tiers||"").trim()||F.KUB_TIERS;
        if(F.parseTiers(tiers).some(t=>!isFinite(t.fee)||isNaN(t.upTo)))return "Проверьте тарифы: например «1000:0; 3000:9; 59».";
        Object.assign(o,{balance:F.r2(num(x.balance)),takenDate:x.takenDate,balanceDate:x.takenDate,payDay:+x.takenDate.slice(8),freeDays:+x.freeDays||7,planDate:x.planDate||"",tiers});
      }else if(isCustom(x)){
        Object.assign(o,{payPlan:"custom",schedule:d&&d.schedule||[],balance:0,payDay:1});
      }else{
        const e=need(x.balance,"Введите остаток долга.");if(e)return e;
        const weekly=x.kind==="installment"&&(x.payEvery==="w"||x.payEvery==="2w");
        let pd=parseInt(x.payDay,10);
        if(weekly){if(!x.firstPay)return "Укажите дату ближайшего платежа.";pd=+x.firstPay.slice(8)}
        else if(!(pd>=1&&pd<=31))return "Укажите день платежа от 1 до 31.";
        const n=parseInt(x.termLeft,10),hasPay=num(x.payment)>0;
        if(!(n>=1&&n<=600)&&!hasPay)return "Укажите, сколько платежей осталось, или размер платежа.";
        Object.assign(o,{balance:F.r2(num(x.balance)),rate:num(x.rate),payDay:pd,payType:x.kind==="loan"?x.payType:"annuity"});
        if(n>=1&&n<=600)o.termLeft=n;
        if(num(x.lastPayment)>0)o.lastPayment=F.r2(num(x.lastPayment));
        if(weekly){o.payEvery=x.payEvery;o.firstPay=x.firstPay}
        const p=num(x.payment);if(p>0)o.payment=F.r2(p);
        if(o.rate<0||o.rate>200)return "Проверьте ставку.";
      }
      await store.put("debts",o);
      if(!d&&o.payPlan==="custom")setTimeout(()=>{debtView(o.id);fillForm(o.id)},60);
    }
  });
}

async function syncPlan(txId,cardId,plan){
  for(const d of data.debts.filter(x=>x.kind==="card")){
    const had=(d.plans||[]).some(q=>q.id===txId), want=!!plan&&d.id===cardId;
    if(!had&&!want)continue;
    let plans=(d.plans||[]).filter(q=>q.id!==txId);
    if(want)plans=plans.concat(plan);
    await store.put("debts",{...d,plans});
  }
}

function debtView(id){
  const s=C.states.find(x=>x.id===id), d=view("debts").find(x=>x.id===id);if(!s)return;
  if(s.isCard)return cardView(s,d);
  if(s.isKub)return kubView(s,d);
  if(s.isCustom)return customView(s,d);
  const demo=id.startsWith("ex-");
  const rows=C.sim.months.filter(r=>r.per[id]).slice(0,24);
  const alone=F.simulate([s],0,"min",curMk);
  const payoff=C.sim.payoff[id];
  let grace="";
  if(s.kind==="card"&&s.graceEnd&&s.principal>0){
    grace=today<=s.graceEnd
      ?`<div class="alert">Льготный период до <b>${dLabel(s.graceEnd,{day:"numeric",month:"long"})}</b>. Погасите ${m0(s.principal)} до этой даты, и процентов не будет.${s.retro?" Если не успеть, банк начислит проценты за весь период с "+dLabel(s.graceStart,{day:"numeric",month:"long"})+".":""}</div>`
      :`<div class="alert bad">Льготный период закончился ${dLabel(s.graceEnd,{day:"numeric",month:"long"})}. Проценты начисляются каждый день: примерно ${money(s.principal*s.rate/100/365)} в день.</div>`;
  }
  const hist=data.tx.filter(t=>t.debtId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const lastP=(()=>{const m=alone.months.filter(r=>r.per[id]);if(!m.length)return null;const p=m[m.length-1].per[id];const x=p.dues?p.dues[p.dues.length-1]:p;return {pay:x.pay-(p.dues?0:s.fees),date:x.date||x.due}})();
  const lastWarn=lastP&&+d.lastPayment>0&&Math.abs(lastP.pay-d.lastPayment)>1?`<div class="alert">В банке последний платёж ${money(d.lastPayment)}, а по расчёту выходит ${money(lastP.pay)}. Если разница большая, проверьте остаток долга и число платежей.</div>`:"";
  openView(s.name,`
    <div class="facts">
      <div><span>Остаток долга</span><b>${money(s.principal)}</b></div>
      <div><span>Набежало процентов</span><b class="neg">${money(s.accruedNow)}</b></div>
      <div><span>Ставка</span><b>${pct(s.rate)}</b></div>
      <div><span>Следующий платёж</span><b>${s.principal>0?money(s.nextAmount)+", "+dLabel(s.nextDue):"—"}</b></div>
      ${s.kind!=="card"?`<div><span>Осталось платежей</span><b>${isFinite(s.termLeft)?s.termLeft:"∞"}${s.step?", "+EVERY[s.every]:""}</b></div>`:`<div><span>Мин. платёж</span><b>${pct(s.minPct)}${s.minFixed?", от "+m0(s.minFixed):""}</b></div>`}
      <div><span>Закрою по плану</span><b>${payoff?esc(mkLabel(payoff,true)):"—"}</b></div>
      <div><span>Последний платёж</span><b>${lastP?money(lastP.pay)+", "+dLabel(lastP.date,{day:"numeric",month:"short",year:"numeric"}):"—"}</b></div>
      <div><span>Переплата без доплат</span><b>${alone.stuck?"не закрыть":m0(alone.interest+alone.fees)}</b></div>
      <div><span>Уже выплачено</span><b>${m0(s.paidPrin+s.paidInt)}</b></div>
    </div>
    ${grace}${lastWarn}
    ${s.growing?`<div class="alert bad">Платёж меньше начисляемых процентов, долг не уменьшается. Проверьте условия или внесите досрочно.</div>`:""}
    ${demo?`<div class="demo">Это пример. Добавьте свой долг кнопкой «+ Долг».</div>`:`<div class="btns"><button class="primary" data-act="payDebt" data-id="${esc(id)}">Записать платёж</button><button class="ghost" data-act="earlyDebt" data-id="${esc(id)}">Внести досрочно</button></div>
    <button class="ghost" data-act="editDebt" data-id="${esc(id)}">Изменить условия или остаток</button>`}
    <h3 style="font-size:14px">График по выбранной стратегии</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Платёж</th><th>Проценты</th><th>В долг</th><th>Остаток</th></tr></thead><tbody>

  `);
}
function kubView(s,d){

  if(owed>0.005){
    if(!s.paying)alerts.push(`<div class="alert">Верните <b>${money(s.principal)}</b> до <b>${dLabel(s.lastFree,L)}</b> включительно, и это будет бесплатно. Если не успеть, ${dLabel(s.freeEnd,L)} сразу начислится <b>${money(s.lateCost)}</b>: комиссия за все дни с ${dLabel(s.taken,L)}. Дальше по ${money(s.dayFee)} в день.</div>`);
    else if(!s.penalty)alerts.push(`<div class="alert bad">Бесплатный период закончился, комиссия идёт каждый день: ${money(s.dayFee)}, это около ${pct(s.rate)} годовых. Уже набежало ${money(s.accruedNow)}. Погасите всё до <b>${dLabel(s.billDue,L)}</b>, иначе сверху начнётся штраф ${pct(20)} годовых.</div>`);

      <div><span>Долг</span><b>${money(owed)}</b></div>
      <div><span>Бесплатно до</span><b>${dLabel(s.lastFree,L)} включительно</b></div>

      <div><span>Набежало</span><b class="neg">${money(s.accruedNow)}</b></div>
      <div><span>Вернуть по плану</span><b>${owed>0.005?money(s.nextAmount)+", "+dLabel(s.planDate):"—"}</b></div>
      <div><span>Уже вернули</span><b>${m0(s.paidPrin)}</b></div>
    </div>
    ${alerts.join("")}
    ${demo?`<div class="demo">Это пример. Добавьте свою Кубышку кнопкой «+ Долг».</div>`:`<div class="btns"><button class="primary" data-act="payDebt" data-id="${esc(id)}">Записать возврат</button><button class="ghost" data-act="editDebt" data-id="${esc(id)}">Изменить</button></div>`}
    <h3 style="font-size:14px">Комиссия в день, если не вернуть вовремя</h3>
    <div class="list">${tiers.map((t,i)=>`<div class="meta"><span>${t.upTo===Infinity?"больше "+m0(tiers[i-1]?tiers[i-1].upTo:0):(i?m0(tiers[i-1].upTo)+" – ":"до ")+m0(t.upTo)}</span><b>${t.fee?m0(t.fee)+" в день":"бесплатно"}</b></div>`).join("")}</div>
    <p class="note" style="margin:0">Не больше 0,8% долга в день. Начисленное 1-го числа нужно погасить до 25-го, иначе добавится штраф 20% годовых. Точные условия: приложение Т-Банка → «Счёт карты» → «Кубышка» → «Детали» → «Тариф и условия».</p>
    ${hist.length?`<h3 style="font-size:14px">Возвраты</h3><div class="list">${hist.map(t=>`<div class="item"><span class="ic in">+</span><span class="t"><span>Возврат</span><span>${dLabel(t.date,{day:"numeric",month:"long",year:"numeric"})}</span></span><span class="a">${money(t.amount)}</span></div>`).join("")}</div>`:""}
  `);
}

    ${s.overdue?`<div class="alert bad">Платёж от ${dLabel(s.nextDue,{day:"numeric",month:"long"})} не отмечен. Если вы его внесли, нажмите «Записать платёж».</div>`:""}
    ${!rows.length?`<div class="alert">График пока пустой. Нажмите «Заполнить график» и перепишите платежи из приложения банка: дату, сумму и комиссию.</div>`:""}
    ${demo?"":`<div class="btns"><button class="primary" data-act="payDebt" data-id="${esc(id)}">Записать платёж</button><button class="ghost" data-act="editDebt" data-id="${esc(id)}">Изменить</button></div>
    <div class="btns"><button class="ghost" data-act="fillSched" data-id="${esc(id)}">Заполнить график</button><button class="ghost" data-act="addRow" data-id="${esc(id)}">Добавить платёж</button></div>`}
    ${rows.length?`<h3 style="font-size:14px">График платежей</h3>
    <p class="note" style="margin:0">Нажмите на строку, чтобы поправить сумму или комиссию.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Платёж</th><th>Комиссия</th><th>В долг</th><th></th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="click" data-act="row" data-debt="${esc(id)}" data-id="${esc(r.id)}"><td>${dLabel(r.date,L)}</td><td>${money(r.amount)}</td><td class="neg">${money(r.fee)}</td><td>${money(r.amount-r.fee)}</td><td>${i<s.paidCount?'<span class="pos">✓</span>':""}</td></tr>`).join("")}
    </tbody></table></div>`:""}
  `);
}
function rowForm(debtId,r){
  const d=data.debts.find(x=>x.id===debtId);if(!d)return;
  const sch=d.schedule||[];
  const last=sch.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  const v=r?{...r}:{date:last?F.dueIn(F.addMonths(last.date.slice(0,7),1),+last.date.slice(8)):today,amount:last?last.amount:"",fee:last?last.fee:""};
  openForm({title:r?"Платёж по графику":"Новый платёж в графике",values:v,noFocus:true,
    fields:[
      {k:"date",type:"date",label:"Дата платежа"},
      {k:"amount",type:"money",label:"Платёж, ₽",half:true,hint:"Сколько спишут всего"},
      {k:"fee",type:"money",label:"Из него комиссия, ₽",half:true,hint:"0, если комиссии нет"}
    ],
    onDelete:r?async()=>{await store.put("debts",{...d,schedule:sch.filter(x=>x.id!==r.id)});debtView(debtId)}:null,deleteLabel:"Удалить платёж",
    async onSave(x){
      if(!x.date)return "Укажите дату.";
      const e=need(x.amount,"Введите сумму платежа.");if(e)return e;
      const fee=num(x.fee);if(fee<0||fee>num(x.amount))return "Комиссия не может быть больше платежа.";
      const o={id:r?r.id:uid(),date:x.date,amount:F.r2(num(x.amount)),fee:F.r2(fee)};
      await store.put("debts",{...d,schedule:sch.filter(q=>q.id!==o.id).concat(o)});
      setTimeout(()=>debtView(debtId),60);
    }});
}
function fillForm(debtId){
  const d=data.debts.find(x=>x.id===debtId);if(!d)return;
  const has=(d.schedule||[]).length>0;
  openForm({title:"Заполнить график",values:{first:today,count:"",amount:"",fee:"",every:"month",replace:!has},noFocus:true,saveLabel:"Добавить платежи",
    fields:[
      {k:"_n",type:"note",label:"Добавлю одинаковые строки, а потом поправьте суммы тех месяцев, где платёж другой: нажмите на строку в графике."},
      {k:"first",type:"date",label:"Первый платёж",half:true},
      {k:"count",type:"int",label:"Сколько платежей",half:true},
      {k:"amount",type:"money",label:"Платёж, ₽",half:true},
      {k:"fee",type:"money",label:"Из него комиссия, ₽",half:true},
      {k:"every",type:"seg",label:"Как часто",opts:[["month","Раз в месяц"],["2w","Раз в 2 недели"],["w","Раз в неделю"]]},
      {k:"replace",type:"check",label:"Заменить текущий график",show:()=>has}
    ],
    async onSave(x){
      if(!x.first)return "Укажите дату первого платежа.";
      const n=parseInt(x.count,10);if(!(n>=1&&n<=120))return "Укажите число платежей от 1 до 120.";
      const e=need(x.amount,"Введите сумму платежа.");if(e)return e;
      const fee=num(x.fee);if(fee<0||fee>num(x.amount))return "Комиссия не может быть больше платежа.";
      const rows=[];
      for(let i=0;i<n;i++){
        const date=x.every==="month"?F.dueIn(F.addMonths(x.first.slice(0,7),i),+x.first.slice(8)):F.addDays(x.first,i*(x.every==="w"?7:14));
        rows.push({id:uid()+i,date,amount:F.r2(num(x.amount)),fee:F.r2(fee)});
      }
      await store.put("debts",{...d,schedule:(x.replace||!has?[]:d.schedule||[]).concat(rows)});
      setTimeout(()=>debtView(debtId),60);
    }});
}
function cardView(s,d){
  const id=s.id, demo=id.startsWith("ex-"), L={day:"numeric",month:"long"};
  const rows=C.sim.months.filter(r=>r.per[id]).slice(0,24);
  const payoff=C.sim.payoff[id];
  const alerts=[];
  if(s.overdue)alerts.push(`<div class="alert bad">Минимальный платёж по прошлой выписке внесён не полностью. Банк может взять штраф, а просрочка попадёт в кредитную историю.</div>`);
  if(!s.graceOk&&s.principal>0)alerts.push(`<div class="alert bad">Льготный период потерян: на покупки начисляется ${pct(s.rP)} годовых. Чтобы вернуть льготу, внесите полный платёж по следующей выписке.</div>`);
  if(s.principal>0){
    if(s.due)alerts.push(`<div class="alert">Выписка от ${dLabel(s.lastS,L)}. Чтобы не платить проценты за покупки, внесите <b>${money(s.nextG)}</b> до <b>${dLabel(s.due,L)}</b>. Минимальный платёж: ${money(s.nextM)}.${s.nextG>s.nextM&&s.atRisk>1?` Если внести только минимальный, за покупки начислят около <b>${money(s.atRisk)}</b>.`:""}</div>`);
    else alerts.push(`<p class="note" style="margin:0">Следующая выписка ${dLabel(s.previewS,L)}. Ожидается: для льготы ${money(s.nextG)}, минимальный ${money(s.nextM)}, внести до ${dLabel(s.nextDue,L)}.</p>`);
  }
  let reserve="";
  const R=+d.reserve||0;
  if(R>0){
    const no=F.debtToday({...d,reserve:0},paysFor(id),today,spendsFor(id));
    const a=F.simulate([s],0,"min",curMk,13), b=F.simulate([no],0,"min",curMk,13);
    const year=Math.max(0,(a.interest+a.fees)-(b.interest+b.fees));
    const fee=(+d.reserveFeePct||+d.reserveFeeMin)?Math.max(R*(+d.reserveFeePct||0)/100,+d.reserveFeeMin||0):0;
    const month=R*s.rC/100*28/365+fee;
    reserve=`<h3 style="font-size:14px">Резерв ${m0(R)}</h3>
    <div class="facts"><div><span>Платёж по выписке меньше на</span><b class="pos">${m0(Math.max(0,no.nextG-s.nextG))}</b></div><div><span>Минимальный меньше на</span><b class="pos">${m0(Math.max(0,no.nextM-s.nextM))}</b></div>
    <div><span>Стоит в месяц</span><b class="neg">≈ ${m0(month)}</b></div><div><span>За год</span><b class="neg">≈ ${m0(year||month*12)}</b></div></div>
    <div class="alert bad">После выписки резерв снова уходит в долг как снятие или перевод: под ${pct(s.rC)} годовых и без льготы${fee?`, плюс комиссия ${m0(fee)}`:""}. Долг от этого не уменьшается, он только выглядит меньше в выписке. Если один раз закрыть эту сумму своими деньгами, проценты перестанут начисляться.</div>`;
  }
  const plans=s.plans.map(p=>`<button class="item" data-act="plan" data-card="${esc(id)}" data-id="${esc(p.id)}"><span class="ic sub">${p.left}</span><span class="t"><span>${esc(p.name)}</span><span>${p.left>0?`осталось ${p.left} из ${p.months}, ${money(p.monthly)}${p.fee?" + "+money(p.fee)+(p.feeMonthly?" комиссия":" разово"):""}${p.left>1?", последний "+money(p.rem-p.monthly*(p.left-1)):""}`:"выплачена"}</span></span><span class="a">${m0(p.rem)}<small>${p.fee&&p.feeMonthly&&p.left?"комиссия ещё "+m0(p.fee*p.left):""}</small></span></button>`).join("");
  const hist=data.tx.filter(t=>t.debtId===id||t.cardId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
  openView(s.name,`
    <div class="facts">
      <div><span>Долг всего</span><b>${money(s.principal)}</b></div>
      <div><span>Доступно</span><b>${+d.limit>0?m0(Math.max(0,d.limit-s.principal)):"—"}</b></div>
      <div><span>Покупки, ${pct(s.rP)}</span><b>${money(Math.max(0,s.purch))}</b></div>
      <div><span>Снятия, переводы, ${pct(s.rC)}</span><b>${money(s.cash)}</b></div>
      <div><span>Рассрочки, остаток</span><b>${money(s.plansRem)}</b></div>
      <div><span>Проценты к выписке</span><b class="neg">${money(s.accruedNow)}</b></div>
      <div><span>Мин. платёж</span><b>${pct(s.minPct)}, от ${m0(s.minFixed)}</b></div>
      <div><span>Закрою по плану</span><b>${payoff?esc(mkLabel(payoff,true)):s.principal>0?"не видно":"—"}</b></div>
    </div>
    ${alerts.join("")}
    ${demo?`<div class="demo">Это пример. Добавьте свою карту кнопкой «+ Долг».</div>`:`<div class="btns"><button class="primary" data-act="payDebt" data-id="${esc(id)}">Записать платёж</button><button class="ghost" data-act="editDebt" data-id="${esc(id)}">Изменить</button></div>`}
    ${reserve}
    <div class="card-h"><h3 style="font-size:14px">Рассрочки по карте</h3>${demo?"":`<button class="link" data-act="addPlan" data-card="${esc(id)}">Добавить</button>`}</div>
    <div class="list">${plans||`<p class="empty">Рассрочек нет.</p>`}</div>
    <h3 style="font-size:14px">Платежи по выпискам</h3>
    <p class="note" style="margin:0">Прогноз без новых покупок, по выбранной стратегии. В платёж входят платежи по рассрочкам и комиссии.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Платёж</th><th>Проценты</th><th>В долг</th><th>Остаток</th></tr></thead><tbody>
    ${rows.map(r=>{const p=r.per[id];return `<tr><td>${dLabel(p.due,{day:"numeric",month:"short",year:"2-digit"})}</td><td>${money(p.pay)}</td><td class="neg">${money(p.int)}</td><td>${money(p.prin)}</td><td>${m0(p.rest)}</td></tr>`}).join("")}
    </tbody></table></div>
    ${hist.length?`<h3 style="font-size:14px">Операции по карте</h3><div class="list">${hist.map(t=>`<div class="item"><span class="ic ${t.debtId?"in":"dbt"}">${t.debtId?"+":"−"}</span><span class="t"><span>${t.debtId?"Платёж на карту":t.cardOp==="inst"?"Рассрочка: "+esc(t.note||t.cat):t.cardOp==="cash"?"Снятие или перевод":esc(t.cat)}</span><span>${dLabel(t.date,{day:"numeric",month:"long",year:"numeric"})}</span></span><span class="a">${money(t.amount)}</span></div>`).join("")}</div>`:""}
  `);
}
function monthView(mk){
  const m=C.months.find(x=>x.mk===mk);if(!m)return;
  const items=view("income").filter(i=>i.repeat!=="once"||i.from===mk);
  const demo=isDemo("income");
  const vals={};items.forEach(i=>{vals["o_"+i.id]=String(incomeFor(i,mk))});
  if(demo||!items.length){
    openView(mkLabel(mk,true),`<div class="facts"><div><span>Доходы по плану</span><b>${m0(m.planIn)}</b></div><div><span>Свободно</span><b>${m0(m.free)}</b></div></div>
      <p class="note">${demo?"Добавьте свои доходы в «План доходов», и здесь можно будет поправить суммы для отдельного месяца.":"Доходов в плане пока нет."}</p>`);
    return;
  }
  openForm({title:mkLabel(mk,true),values:vals,noFocus:true,saveLabel:"Сохранить для этого месяца",
    fields:items.map(i=>({k:"o_"+i.id,type:"money",label:i.name+", ₽",hint:(i.overrides&&i.overrides[mk]!=null)?`Изменено. Обычно ${m0(i.amount)}. Очистите поле, чтобы вернуть.`:"По плану"})),
    async onSave(x){
      for(const i of items){
        const raw=x["o_"+i.id], n=parseNum(raw), ov={...(i.overrides||{})};
        const base=i.repeat==="once"?(i.from===mk?+i.amount:0):+i.amount;
        if(raw===""||!isFinite(n)||n===base)delete ov[mk]; else ov[mk]=F.r2(n);
        if(JSON.stringify(ov)!==JSON.stringify(i.overrides||{}))await store.put("income",{...i,overrides:ov});
      }
    }});
}
function calendarView(){
  const ev=events(30);
  openView("Календарь на 30 дней",`<div class="list">${ev.length?ev.map(evRow).join(""):`<p class="empty">Платежей нет.</p>`}</div>
    <div class="meta"><span>Списания за 30 дней</span><b class="neg">${m0(ev.filter(e=>e.kind!=="in"&&!e.late).reduce((s,e)=>s+e.amount,0))}</b></div>
    <div class="meta"><span>Поступления за 30 дней</span><b class="pos">${m0(ev.filter(e=>e.kind==="in").reduce((s,e)=>s+e.amount,0))}</b></div>`);
}
async function mark(kind,id,date,amount){
  const d=date<=today?date:today;
  if(kind==="debt"){
    const debt=data.debts.find(x=>x.id===id);
    await store.put("tx",{id:uid(),type:"out",amount:F.r2(amount),cat:"Кредиты",note:"",date:d,created:Date.now(),debtId:id,payKind:"regular"});
  }else if(kind==="sub"){
    const s=data.subs.find(x=>x.id===id);if(!s)return;
    await store.put("tx",{id:uid(),type:"out",amount:F.r2(amount),cat:"Подписки",note:s.name,date:d,created:Date.now()});
    await store.put("subs",{...s,nextDate:nextSubDate(s,s.nextDate)});
  }else{
    const i=data.income.find(x=>x.id===id);if(!i)return;
    await store.put("tx",{id:uid(),type:"in",amount:F.r2(amount),cat:/зарплат|аванс/i.test(i.name)?"Зарплата":"Другое",note:i.name,date:d,created:Date.now(),planId:id});
  }
}

/* ---------------- обработка нажатий ---------------- */
document.addEventListener("click",async e=>{
  const segB=e.target.closest("[data-seg]");
  if(segB&&sheetState&&sheetState.form){const vs=sheetState.vals;vs[segB.dataset.seg]=segB.dataset.v;if(segB.dataset.seg==="type"&&CATS[vs.type]&&!CATS[vs.type].includes(vs.cat))vs.cat=CATS[vs.type][0];drawForm();return}
  const tabB=e.target.closest(".tabs button");
  if(tabB){tab=tabB.dataset.tab;try{localStorage.setItem("koshelek.tab",tab)}catch(x){}render();window.scrollTo(0,0);return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  switch(act){
    case "close":closeSheet();break;
    case "del":{
      const st=sheetState;if(!st||!st.form)break;
      if(!st.armed){st.armed=true;drawForm();break}
      try{await st.form.onDelete();closeSheet()}catch(x){$("sfErr").textContent="Не удалось удалить. Попробуйте ещё раз."}
      break;}
    case "prevM":opsMonth=F.addMonths(opsMonth,-1);render();break;
    case "nextM":opsMonth=F.addMonths(opsMonth,1);render();break;
    case "editTx":{if(id.startsWith("ex-")){txForm(null);break}const t=data.tx.find(x=>x.id===id);if(t)txForm(t);break}
    case "debt":debtView(id);break;
    case "payDebt":{const s=C.states.find(x=>x.id===id);txForm(null,{cat:"Кредиты",debtId:id,payKind:"regular",amount:s?String(s.nextAmount):"",date:today});break}
    case "earlyDebt":txForm(null,{cat:"Кредиты",debtId:id,payKind:"early",earlyMode:"term",date:today});break;
    case "addPlan":planForm(a.dataset.card,null);break;
    case "fillSched":fillForm(id);break;
    case "addRow":rowForm(id,null);break;
    case "row":{if(a.dataset.debt.startsWith("ex-"))break;const d=data.debts.find(x=>x.id===a.dataset.debt);const r=d&&(d.schedule||[]).find(q=>q.id===id);if(r)rowForm(d.id,r);break}
    case "plan":{if(a.dataset.card.startsWith("ex-"))break;const d=data.debts.find(x=>x.id===a.dataset.card);const pl=d&&(d.plans||[]).find(q=>q.id===id);if(pl)planForm(d.id,pl);break}
    case "editDebt":{const d=data.debts.find(x=>x.id===id);if(d)debtForm(d);break}
    case "income":{const i=data.income.find(x=>x.id===id);incomeForm(i||null);break}
    case "addIncome":incomeForm(null);break;
    case "sub":{const s=data.subs.find(x=>x.id===id);subForm(s||null);break}
    case "addSub":subForm(null);break;
    case "saving":{const s=data.savings.find(x=>x.id===id);savingForm(s||null);break}
    case "strategy":store.saveSettings({strategy:a.dataset.s});break;
    case "month":monthView(a.dataset.mk);break;
    case "living":livingForm();break;
    case "budget":budgetForm();break;
    case "calendar":calendarView();break;
    case "mark":{a.disabled=true;try{await mark(a.dataset.kind,id,a.dataset.date,+a.dataset.amount);if(sheetState&&sheetState.view)calendarView()}catch(x){a.disabled=false;a.textContent="Ошибка, ещё раз"}break}
  }
});
$("fab").addEventListener("click",()=>{
  ({home:()=>txForm(null),ops:()=>txForm(null),debts:()=>debtForm(null),plan:()=>incomeForm(null),save:()=>savingForm(null)})[tab]();
});
document.addEventListener("input",e=>{
  if(e.target.id==="exRange"){$("exVal").textContent=m0(+e.target.value)+" / мес"}
});
document.addEventListener("change",e=>{
  if(e.target.id==="exRange")store.saveSettings({extra:+e.target.value});
  if(e.target.id==="taxBox")store.saveSettings({tax:e.target.checked});
});

COLS.forEach(c=>{loaded[c]=false});
render();
if(TG){
  try{TG.ready();TG.expand()}catch(e){}
  const theme=()=>{document.documentElement.dataset.theme=TG.colorScheme==="dark"?"dark":"light";try{TG.setHeaderColor(TG.colorScheme==="dark"?"#0F1512":"#EDF0EA");TG.setBackgroundColor(TG.colorScheme==="dark"?"#0F1512":"#EDF0EA")}catch(e){}};
  theme();try{TG.onEvent("themeChanged",theme)}catch(e){}
}
initDb();
})();
</script>
