<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кошелёк</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FAFBF8; --surface-2:#E2E7DF; --ink:#16211C; --muted:#667068; --line:#D3DAD0;
  --accent:#0F6B5A; --accent-ink:#F4FAF7; --in:#23845A; --out:#B9473B; --warn:#B7791F;
  --shadow:0 1px 2px rgba(22,33,28,.06),0 8px 24px rgba(22,33,28,.06);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512; --surface:#171F1B; --surface-2:#212B26; --ink:#E3EAE5; --muted:#8E9A93; --line:#2A3530;
  --accent:#4DBE9F; --accent-ink:#0B1411; --in:#5CC98E; --out:#EE7F70; --warn:#E3AC4F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512; --surface:#171F1B; --surface-2:#212B26; --ink:#E3EAE5; --muted:#8E9A93; --line:#2A3530;
    --accent:#4DBE9F; --accent-ink:#0B1411; --in:#5CC98E; --out:#EE7F70; --warn:#E3AC4F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:12px 110px;font-variant-numeric:tabular-nums;touch-action:pan-y;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.brand{font-family:Unbounded,sans-serif;font-weight:700;font-size:17px}
.sync{font-size:12px;color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.total{display:flex;flex-direction:column;gap:2px}
.total .num{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(28px,8.5vw,38px);letter-spacing:-.02em;line-height:1.15}
.note{font-size:13px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.debt{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.debt.done{opacity:.6}
.debt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border:0;background:none;padding:0;text-align:left;width:100%}
.debt-top .n{font-weight:600}
.debt-top .b{font-size:13px;color:var(--muted)}
.debt-top .sum{font-family:Unbounded,sans-serif;font-size:19px;white-space:nowrap}
.debt-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.debt-bottom .when{color:var(--muted)}
.debt-bottom .when.late{color:var(--out);font-weight:600}
.pay{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.empty{background:var(--surface);border-radius:18px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;padding:14px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(15,107,90,.35)}

.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;overscroll-behavior:contain;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-family:Unbounded,sans-serif;font-weight:500;font-size:17px;margin:0}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.field.half{grid-column:auto}
.hint{font-size:12px;color:var(--muted)}
input.in{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.check{display:flex;gap:10px;align-items:center;font-size:15px;grid-column:1/-1}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:14px;border-radius:12px;font-size:16px;width:100%}
.danger{border:1px solid var(--line);background:none;color:var(--out);font-weight:600;padding:12px;border-radius:12px;width:100%}
.danger.armed{background:var(--out);color:#fff;border-color:var(--out)}
.err{color:var(--out);font-size:13px;min-height:1em}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
.sub{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface-2);border-radius:12px;padding:4px;grid-column:1/-1}
.seg label{text-align:center;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;font-size:14px}
.facts span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.facts b{font-weight:600}
.sect,.sect2{display:contents}
.seg.every{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 36px;gap:6px;align-items:center}
.gen{background:var(--surface-2);border-radius:12px;padding:10px}
.gen-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.gen-row #genFirst{grid-column:1/-1}
select.in{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 6px;width:100%;min-width:0}
.row .del{border:0;background:var(--surface-2);height:36px;border-radius:10px;font-size:18px}
.ghost{border:1px solid var(--line);background:none;padding:10px 14px;border-radius:12px;font-weight:600;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="brand">Кошелёк</span><span class="sync" id="sync"></span></header>
  <section class="total"><span class="label">Всего долгов</span><span class="num" id="total">0 ₽</span><p class="note" id="count"></p></section>
  <div class="list" id="list"></div>
</div>
<button class="fab" id="add">+ Добавить долг</button>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
/* ---------- утилиты ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
const money=n=>fmt.format(Math.round((+n||0)*100)/100)+" ₽";
const r2=n=>Math.round(n*100)/100;
const parseNum=s=>parseFloat(String(s==null?"":s).replace(/\s/g,"").replace(",","."));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=iso(new Date());
const uid=()=>"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dLabel=s=>new Date(s+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
/* Та же дата в следующем месяце; 31-е переходит на последний день короткого месяца. */
function nextMonth(s){
  const [y,m,d]=s.split("-").map(Number);
  const ny=m===12?y+1:y, nm=m===12?1:m+1, last=new Date(ny,nm,0).getDate();
  return ny+"-"+pad(nm)+"-"+pad(Math.min(d,last));
}

/* Дата платежа номер n (с нуля) по графику: то же число, что у первого платежа; в коротком месяце — последний день. */
function schedDate(first,n){
  const [y,m,d]=first.split("-").map(Number);
  const t=(m-1)+n, ny=y+Math.floor(t/12), nm=((t%12)+12)%12+1, last=new Date(ny,nm,0).getDate();
  return ny+"-"+pad(nm)+"-"+pad(Math.min(d,last));
}
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return iso(new Date(y,m-1,d+n))};
const STEP={"2w":14,"w":7};
/* Весь график платежей: раз в месяц, раз в 1–2 недели от первой даты или свой список дат и сумм. */
function schedule(d){
  if(d.every==="custom")return (d.rows||[]).filter(r=>r.date&&r.amount>0).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const total=+d.total||0,pay=+d.payment||0,last=+d.lastPayment>0?+d.lastPayment:pay,out=[];
  if(!d.firstPay)return out;
  for(let k=0;k<total;k++)out.push({date:STEP[d.every]?addDays(d.firstPay,k*STEP[d.every]):schedDate(d.firstPay,k),amount:k===total-1?last:pay});
  return out;
}
/* Дата платежа, если сдвинуться от date на n шагов графика (n может быть отрицательным). */
const shiftBy=(every,date,n)=>STEP[every]?addDays(date,n*STEP[every]):schedDate(date,n);
/* Кредит или рассрочка с графиком: всё считается из условий и отмеченных платежей.
   Ранний платёж засчитывается за ближайшую дату графика и график не сдвигает. */
function loanInfo(d){
  const sc=schedule(d),total=sc.length;
  const paidCount=Math.min(total,(+d.paidBefore||0)+(d.payments||[]).length);
  const left=Math.max(0,total-paidCount);
  const sum=l=>r2(l.reduce((s,x)=>s+x.amount,0));
  const remaining=sum(sc.slice(paidCount));
  const paidSum=r2(sum(sc.slice(0,Math.min(total,+d.paidBefore||0)))+(d.payments||[]).reduce((s,p)=>s+p.amount,0));
  const schedTotal=sum(sc);
  const lastRow=sc[total-1];
  return {sched:sc,total,pay:+d.payment||0,last:lastRow?lastRow.amount:0,paidCount,left,remaining,paidSum,schedTotal,
    overpay:+d.amount>0?r2(schedTotal-d.amount):null,
    nextDate:left?sc[paidCount].date:"",
    nextAmount:left?sc[paidCount].amount:0,
    afterNext:left>1?sc[paidCount+1].date:"",
    lastDate:lastRow?lastRow.date:"",
    /* Будущие проценты видны, пока с момента ввода остатка без процентов не прибавилось платежей. */
    futureInt:+d.principalNow>0&&d.principalAt===paidCount?r2(remaining-d.principalNow):null,
    realRate:realRate(d,sc)};
}
/* Реальная стоимость в % годовых: при какой ставке цена покупки равна всем платежам по графику. */
function realRate(d,sc){
  if(!(+d.amount>0)||!sc.length)return null;
  const start=d.issued||shiftBy(d.every,sc[0].date,-1);
  const flows=sc.map(x=>[(new Date(x.date)-new Date(start))/864e5/365,x.amount]);
  const pv=r=>flows.reduce((s,[t,a])=>s+a/Math.pow(1+r,t),0);
  if(pv(0)<=d.amount+0.005)return 0;
  let lo=0,hi=20;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(pv(m)>d.amount)lo=m;else hi=m}
  return Math.round(12*(Math.pow(1+lo,1/12)-1)*1000)/10;
}
const isLoan=d=>d.kind==="loan"||d.kind==="inst";
const balOf=d=>isLoan(d)?loanInfo(d).remaining:d.balance;
const nextOf=d=>isLoan(d)?loanInfo(d).nextDate:d.nextDate;

/* ---------- данные ---------- */
let debts=[];
const LS="koshelek.simple.v1";

/* Облако Telegram хранит строки до 4096 символов, поэтому список режется на части.
   Ключи с префиксом s1_ — отдельно от прошлых версий приложения. */
const TG=window.Telegram&&window.Telegram.WebApp;
const CS=TG&&TG.initData&&TG.isVersionAtLeast&&TG.isVersionAtLeast("6.9")?TG.CloudStorage:null;
const cs=(fn,...a)=>new Promise((ok,bad)=>CS[fn](...a,(e,r)=>e?bad(e):ok(r)));
const CHUNK=3900;
let chunks=0,timer=null,saving=false,dirty=false;

function setSync(t){$("sync").textContent=t}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(debts));localStorage.setItem(LS+".pending",dirty?"1":"")}catch(e){}}
function save(){
  dirty=true;saveLocal();render();
  if(!CS){setSync("Только на этом устройстве");return}
  setSync("Сохраняю…");clearTimeout(timer);timer=setTimeout(flush,400);
}
async function flush(){
  if(saving){timer=setTimeout(flush,300);return}
  saving=true;dirty=false;
  try{
    const json=JSON.stringify(debts),n=Math.ceil(json.length/CHUNK);
    for(let i=0;i<n;i++)await cs("setItem","s1_"+i,json.slice(i*CHUNK,(i+1)*CHUNK));
    await cs("setItem","s1_n",String(n));
    if(chunks>n){const old=[];for(let i=n;i<chunks;i++)old.push("s1_"+i);await cs("removeItems",old)}
    chunks=n;saveLocal();setSync("Сохранено в Telegram");
  }catch(e){dirty=true;saveLocal();setSync("Не сохранилось, повторю");timer=setTimeout(flush,5000)}
  saving=false;
}
async function load(){
  try{debts=JSON.parse(localStorage.getItem(LS))||[]}catch(e){debts=[]}
  render();
  if(!CS){setSync(TG&&TG.initData?"Обновите Telegram, чтобы данные сохранялись в облаке":"Только на этом устройстве");return}
  setSync("Загружаю…");
  try{
    const n=+(await cs("getItem","s1_n"))||0;chunks=n;
    let pending=false;try{pending=localStorage.getItem(LS+".pending")==="1"}catch(e){}
    if(pending&&debts.length){flush();return}
    if(n){
      const keys=[];for(let i=0;i<n;i++)keys.push("s1_"+i);
      const items=await cs("getItems",keys);
      debts=JSON.parse(keys.map(k=>items[k]||"").join(""))||[];
      saveLocal();render();
    }else if(debts.length){flush();return}
    setSync("Сохранено в Telegram");
  }catch(e){setSync("Нет связи с Telegram, данные пока в телефоне")}
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&dirty&&CS&&!saving){clearTimeout(timer);flush()}});

/* ---------- экран ---------- */
function render(){
  const open=debts.filter(d=>balOf(d)>0.005);
  $("total").textContent=money(open.reduce((s,d)=>s+balOf(d),0));
  $("count").textContent=open.length?open.length+" "+plural(open.length,"долг","долга","долгов"):"";
  const sorted=debts.slice().sort((a,b)=>(balOf(a)<=0.005)-(balOf(b)<=0.005)||(nextOf(a)||"9").localeCompare(nextOf(b)||"9"));
  $("list").innerHTML=sorted.length?sorted.map(item).join(""):
    `<div class="empty"><b>Долгов пока нет</b><p class="note">Нажмите «Добавить долг» и впишите первый: сколько должны, платёж и дату.</p></div>`;
}
function item(d){
  const L=isLoan(d)?loanInfo(d):null;
  const bal=balOf(d),next=nextOf(d),pay=L?L.nextAmount:d.payment;
  const done=bal<=0.005;
  const late=!done&&next&&next<today;
  const when=done?"Погашен":next?(late?"Просрочен с "+dLabel(next):(next===today?"Сегодня":dLabel(next))):"Дата не указана";
  return `<div class="debt${done?" done":""}">
    <button class="debt-top" data-act="edit" data-id="${esc(d.id)}"><span><span class="n">${esc(d.name)}</span><br><span class="b">${esc(d.bank||"")}</span></span>
      <span style="text-align:right"><span class="sum">${money(bal)}</span>${L&&!done?`<br><span class="sub">${d.kind==="inst"?"рассрочка, ":""}${L.overpay===0?"без переплаты":L.overpay==null?"по графику":"по графику, с процентами"}</span>`:""}</span></button>
    <div class="debt-bottom"><span class="when${late?" late":""}">${pay&&!done?"Платёж "+money(pay)+" · ":""}${when}${L&&!done?`<br><span class="sub">Осталось ${L.left} из ${L.total} платежей</span>`:""}</span>${done?"":`<button class="pay" data-act="pay" data-id="${esc(d.id)}">Оплатил</button>`}</div>
  </div>`;
}
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};

/* ---------- шторка ---------- */
let sheet=null;
function openSheet(title,html,onSave,onDelete){
  sheet={onSave,onDelete,armed:false};
  $("sheet").innerHTML=`<div class="sheet-h"><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
    <form id="f" novalidate>${html}<div class="err" id="err"></div>
    <button class="primary" type="submit">Сохранить</button>
    ${onDelete?`<button class="danger" type="button" data-act="del" style="margin-top:8px">Удалить долг</button>`:""}</form>`;
  $("scrim").hidden=false;
}
function closeSheet(){$("scrim").hidden=true;sheet=null}
const field=(k,label,val,o={})=>`<label class="field${o.half?" half":""}"><span class="label">${label}</span><input class="in" id="${k}" name="${k}" type="${o.type||"text"}"${o.num?' inputmode="decimal"':""} value="${esc(val==null?"":String(val).replace(o.num?".":"\u0000",","))}" placeholder="${esc(o.ph||"")}" autocomplete="off">${o.hint?`<span class="hint">${o.hint}</span>`:""}</label>`;

function debtForm(d){
  const v=d||{kind:"simple",name:"",bank:"",balance:"",payment:"",nextDate:"",monthly:true};
  const k=["loan","inst"].includes(v.kind)?v.kind:"simple";
  const L=d&&isLoan(d)?loanInfo(d):null;
  const facts=L?`<div class="facts">
      <div><span>Осталось платежей</span><b>${L.left} из ${L.total}</b></div>
      <div><span>Следующий</span><b>${L.nextDate?money(L.nextAmount)+", "+dLabel(L.nextDate):"—"}</b></div>
      <div><span>Осталось по графику</span><b>${money(L.remaining)}</b></div>
      <div><span>Уже заплатил</span><b>${money(L.paidSum)}</b></div>
      <div><span>Последний платёж</span><b>${L.lastDate?money(L.last)+", "+new Date(L.lastDate+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}):"—"}</b></div>
      <div><span>Всего по графику</span><b>${money(L.schedTotal)}</b></div>
      ${L.overpay!=null?`<div><span>Переплата</span><b style="color:${L.overpay>0?"var(--out)":"var(--in)"}">${L.overpay>0?money(L.overpay):"нет"}</b></div>`:""}
      ${L.futureInt!=null?`<div><span>Из остатка — проценты</span><b style="color:var(--out)">${money(L.futureInt)}</b></div>`:""}
      ${d.rate?`<div><span>Ставка по договору</span><b>${fmt.format(d.rate)}% годовых</b></div>`:""}
      ${L.realRate?`<div><span>Реальная стоимость</span><b>≈ ${fmt.format(L.realRate)}% годовых</b></div>`:""}
    </div>
    ${L.realRate!=null&&d.rate&&Math.abs(L.realRate-d.rate)>2?`<p class="note">Реальная стоимость посчитана по ${d.kind==="inst"?"цене покупки":"сумме кредита"} и всем платежам графика. Она отличается от ставки по договору: в платежах есть комиссии или ставка менялась.</p>`:""}
    ${+d.principalNow>0&&L.futureInt==null&&L.left?`<p class="note">Остаток без процентов был указан до последних платежей. Обновите его из приложения банка, чтобы видеть будущие проценты.</p>`:""}`:"";
  openSheet(d?"Долг":"Новый долг",`${facts}<div class="fields">
    <div class="seg" role="radiogroup"><label><input type="radio" name="kind" value="simple" ${k==="simple"?"checked":""}>Долг</label><label><input type="radio" name="kind" value="loan" ${k==="loan"?"checked":""}>Кредит</label><label><input type="radio" name="kind" value="inst" ${k==="inst"?"checked":""}>Рассрочка</label></div>
    ${field("name","Название",v.name,{ph:"Например, кредит наличными"})}
    ${field("bank","Кому должен",v.bank,{ph:"Банк или человек, необязательно"})}
    <div class="sect" data-for="simple">
      ${field("balance","Сколько должен, ₽",v.balance,{num:true,half:true})}
      ${field("payment","Платёж, ₽",k==="simple"?v.payment:"",{num:true,half:true,hint:"Необязательно"})}
      ${field("nextDate","Следующий платёж",v.nextDate,{type:"date",hint:"Необязательно"})}
      <label class="check"><input type="checkbox" id="monthly" ${v.monthly!==false?"checked":""}> Платёж каждый месяц</label>
    </div>
    <div class="sect" data-for="loan inst">
      <label class="field half"><span class="label" data-l-loan="Сумма кредита, ₽" data-l-inst="Стоимость покупки, ₽">Сумма, ₽</span><input class="in" id="amount" inputmode="decimal" value="${esc(v.amount==null?"":String(v.amount).replace(".",","))}" autocomplete="off"></label>
      ${field("rate","Ставка, % годовых",v.rate,{num:true,half:true,hint:"Если знаете"})}
      <label class="field half"><span class="label" data-l-loan="Дата выдачи" data-l-inst="Дата покупки">Дата</span><input class="in" id="issued" type="date" value="${esc(v.issued||"")}"><span class="hint">Необязательно</span></label>
      <div class="seg every" role="radiogroup" aria-label="Как часто платёж">${[["month","Раз в месяц"],["2w","Раз в 2 недели"],["w","Раз в неделю"],["custom","Разные суммы"]].map(([x,l])=>`<label><input type="radio" name="every" value="${x}" ${(v.every||"month")===x?"checked":""}>${l}</label>`).join("")}</div>
      <div class="sect2" data-every="month 2w w">
        ${field("total","Всего платежей",v.every==="custom"?"":v.total,{num:true,half:true})}
        ${field("lpayment","Платёж, ₽",isLoan(v)&&v.every!=="custom"?v.payment:"",{num:true,half:true})}
        ${field("lastPayment","Последний платёж, ₽",v.every==="custom"?"":v.lastPayment,{num:true,half:true,hint:"Если отличается"})}
        ${field("nextPay","Ближайший платёж",d&&isLoan(d)?loanInfo(d).nextDate:"",{type:"date",half:true,hint:"Дальше даты посчитаются сами"})}
      </div>
      <div class="sect2" data-every="custom">
        <div class="field gen"><span class="label">Быстро расставить даты</span>
          <div class="gen-row"><input class="in" id="genFirst" type="date" aria-label="Первый платёж"><input class="in" id="genCount" inputmode="numeric" placeholder="Платежей" aria-label="Сколько платежей">
          <select class="in" id="genStep" aria-label="Шаг"><option value="month">раз в месяц</option><option value="2w">раз в 2 недели</option><option value="w">раз в неделю</option></select></div>
          <button type="button" class="ghost" data-act="gen">Расставить даты</button>
          <span class="hint">Первый платёж графика, число платежей и шаг. Потом впишите суммы. Уже заполненные суммы сохранятся по порядку.</span></div>
        <div class="field"><span class="label">Платежи: дата и сумма</span><div class="rows" id="rows">${((v.every==="custom"&&v.rows)||[]).map(rowHTML).join("")||rowHTML({})}</div>
        <button type="button" class="ghost" data-act="rowadd">+ Платёж</button><span class="hint">Впишите все платежи из приложения банка, включая уже внесённые</span></div>
      </div>
      ${field("paidBefore","Уже внесено платежей",d&&isLoan(d)?(+d.paidBefore||0)+(d.payments||[]).length:v.paidBefore,{num:true,half:true,hint:"Сколько платежей из графика уже позади"})}
      ${field("principalNow","Остаток без процентов, ₽",v.principalNow,{num:true,hint:"Необязательно. Если банк назвал, будет видно, сколько процентов ещё впереди"})}
    </div>
    </div>
    ${d&&(d.payments||[]).length?`<span class="label">Оплаты в приложении</span><div class="hist">${d.payments.slice().reverse().map(p=>`<div><span>${dLabel(p.date)}</span><b>${money(p.amount)}</b></div>`).join("")}</div>`:""}`,
    ()=>{
      const kind=document.querySelector('#f [name=kind]:checked').value;
      const name=$("name").value.trim();if(!name)return "Введите название.";
      const base={...(d||{id:uid(),payments:[],created:Date.now()}),kind,name,bank:$("bank").value.trim()};
      let o;
      if(kind==="loan"||kind==="inst"){
        const every=document.querySelector('#f [name=every]:checked').value;
        /* Отмеченные в приложении оплаты остаются в истории, поэтому «внесено до приложения» = всего внесено − отмеченные. */
        const inApp=d&&isLoan(d)?(d.payments||[]).length:0;
        const paid=parseInt($("paidBefore").value||"0",10);
        const amt=parseNum($("amount").value),rate=parseNum($("rate").value),pn=parseNum($("principalNow").value);
        let plan;
        if(every==="custom"){
          const rows=[...document.querySelectorAll("#rows .row")].map(r=>({date:r.querySelector(".rd").value,amount:r2(parseNum(r.querySelector(".ra").value))}))
            .filter(r=>r.date||r.amount>0);
          if(!rows.length)return "Впишите хотя бы один платёж.";
          if(rows.some(r=>!r.date||!(r.amount>0)))return "У каждого платежа нужны дата и сумма.";
          if(!(paid>=0&&paid<=rows.length))return "Проверьте, сколько платежей уже внесено.";
          plan={every,rows:rows.map(r=>({id:uid(),...r})),total:rows.length,payment:null,lastPayment:null,firstPay:""};
        }else{
          const total=parseInt($("total").value,10);if(!(total>=1&&total<=600))return "Укажите, сколько всего платежей.";
          const pay=parseNum($("lpayment").value);if(!(pay>0))return "Укажите размер платежа.";
          if(!(paid>=0&&paid<=total))return "Проверьте, сколько платежей уже внесено.";
          const next=$("nextPay").value;if(!next&&paid<total)return "Укажите дату ближайшего платежа.";
          const lp=parseNum($("lastPayment").value);
          plan={every,rows:[],total,payment:r2(pay),lastPayment:lp>0?r2(lp):null,firstPay:next?shiftBy(every,next,-paid):(d&&d.firstPay)||""};
        }
        o={...base,...plan,paidBefore:Math.max(0,paid-inApp),amount:amt>0?r2(amt):null,rate:rate>0?rate:null,
          issued:$("issued").value||"",
          principalNow:pn>0?r2(pn):null,principalAt:pn>0?(pn===d?.principalNow&&d?.principalAt!=null?d.principalAt:paid):null};
      }else{
        const bal=parseNum($("balance").value);if(!isFinite(bal)||bal<0)return "Введите, сколько должны.";
        const pay=parseNum($("payment").value);
        o={...base,balance:r2(bal),payment:isFinite(pay)&&pay>0?r2(pay):null,nextDate:$("nextDate").value||"",monthly:$("monthly").checked};
      }
      const i=debts.findIndex(x=>x.id===o.id);if(i>=0)debts[i]=o;else debts.push(o);
      save();
    },
    d?()=>{debts=debts.filter(x=>x.id!==d.id);save()}:null);
  showKind();
}
const rowHTML=r=>`<div class="row"><input class="in rd" type="date" value="${esc(r.date||"")}" aria-label="Дата"><input class="in ra" inputmode="decimal" placeholder="Сумма" value="${r.amount?esc(String(r.amount).replace(".",",")):""}" aria-label="Сумма"><button type="button" class="del" data-act="rowdel" aria-label="Убрать">×</button></div>`;
/* Показывать только поля выбранного вида долга. */
function showKind(){
  const r=document.querySelector('#f [name=kind]:checked');if(!r)return;
  document.querySelectorAll('#f .sect').forEach(el=>{el.hidden=!el.dataset.for.split(" ").includes(r.value)});
  document.querySelectorAll('#f [data-l-loan]').forEach(el=>{el.textContent=el.dataset["l"+(r.value==="inst"?"Inst":"Loan")]});
  const e=document.querySelector('#f [name=every]:checked');
  document.querySelectorAll('#f .sect2').forEach(el=>{el.hidden=!e||!el.dataset.every.split(" ").includes(e.value)});
}
function payForm(d){
  const L=isLoan(d)?loanInfo(d):null;
  const after=L?(L.left>1?"Следующий платёж по графику: "+money(L.sched[L.paidCount+1].amount)+", "+dLabel(L.afterNext)+".":"Это последний платёж."):
    (d.monthly!==false&&d.nextDate?"Сумма вычтется из долга, следующий платёж переедет на "+dLabel(nextMonth(d.nextDate))+".":"Сумма вычтется из долга.");
  openSheet("Оплата: "+d.name,`<div class="fields">
    ${field("amount","Сколько заплатил, ₽",L?L.nextAmount:(d.payment||""),{num:true,half:true})}
    ${field("date","Когда",today,{type:"date",half:true})}
    </div><p class="note">${L?"Засчитается за платёж "+dLabel(L.nextDate)+", даже если внесли раньше. ":""}${after}</p>`,
    ()=>{
      const a=parseNum($("amount").value);if(!isFinite(a)||a<=0)return "Введите сумму.";
      d.payments=(d.payments||[]).concat({id:uid(),date:$("date").value||today,amount:r2(a)});
      if(!L){
        d.balance=r2(Math.max(0,d.balance-a));
        if(d.monthly!==false&&d.nextDate)d.nextDate=nextMonth(d.nextDate);
      }
      save();
    });
}

/* ---------- нажатия ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(e.target===$("scrim")){closeSheet();return}
  if(!a)return;
  const d=debts.find(x=>x.id===a.dataset.id);
  switch(a.dataset.act){
    case "close":closeSheet();break;
    case "rowadd":{
      /* Новая строка: следующая дата с тем же шагом, что между двумя последними, и та же сумма. */
      const rows=[...document.querySelectorAll("#rows .row")],lastR=rows[rows.length-1],prev=rows[rows.length-2];
      let date="",amount="";
      if(lastR){const ld=lastR.querySelector(".rd").value;amount=parseNum(lastR.querySelector(".ra").value)||"";
        if(ld){const pd=prev&&prev.querySelector(".rd").value;const gap=pd?Math.round((new Date(ld)-new Date(pd))/864e5):0;date=gap>0&&gap<28?addDays(ld,gap):schedDate(ld,1)}}
      $("rows").insertAdjacentHTML("beforeend",rowHTML({date,amount}));break}
    case "gen":{
      const first=$("genFirst").value,n=parseInt($("genCount").value,10),step=$("genStep").value;
      if(!first||!(n>=1&&n<=120)){$("err").textContent="Для расстановки дат укажите первый платёж и сколько их.";break}
      $("err").textContent="";
      const old=[...document.querySelectorAll("#rows .ra")].map(i=>i.value);
      $("rows").innerHTML=Array.from({length:n},(_,k)=>rowHTML({date:shiftBy(step,first,k),amount:parseNum(old[k])||""})).join("");
      const f=document.querySelector("#rows .ra");if(f)f.focus();break}
    case "rowdel":{const rows=document.querySelectorAll("#rows .row");if(rows.length>1)a.closest(".row").remove();else a.closest(".row").querySelectorAll("input").forEach(i=>i.value="");break}
    case "edit":if(d)debtForm(d);break;
    case "pay":if(d)payForm(d);break;
    case "del":
      if(!sheet.armed){sheet.armed=true;a.classList.add("armed");a.textContent="Нажмите ещё раз, чтобы удалить";break}
      sheet.onDelete();closeSheet();break;
  }
});
$("add").addEventListener("click",()=>debtForm(null));
$("sheet").addEventListener("change",e=>{if(e.target.name==="kind"||e.target.name==="every")showKind()});
$("sheet").addEventListener("submit",e=>{
  e.preventDefault();if(!sheet)return;
  const err=sheet.onSave();
  if(err){$("err").textContent=err;return}
  closeSheet();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSheet()});

/* ---------- Telegram ---------- */
if(TG){
  try{TG.ready();TG.expand();if(TG.isVersionAtLeast&&TG.isVersionAtLeast("7.7")&&TG.disableVerticalSwipes)TG.disableVerticalSwipes()}catch(e){}
  const theme=()=>{document.documentElement.dataset.theme=TG.colorScheme==="dark"?"dark":"light";try{const c=TG.colorScheme==="dark"?"#0F1512":"#EDF0EA";TG.setHeaderColor(c);TG.setBackgroundColor(c)}catch(e){}};
  theme();try{TG.onEvent("themeChanged",theme)}catch(e){}
}
load();
})();
</script>
</body>
</html>
